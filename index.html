window.showErr = function (msg) {
  var box = document.getElementById('errbox');
  if (!box) {
    box = document.createElement('div');
    box.id = 'errbox';
    box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#c00;color:#fff;font:13px/1.6 sans-serif;padding:10px;white-space:pre-wrap;max-height:40vh;overflow:auto';
    box.onclick = function () { box.style.display = 'none'; };
    (document.body || document.documentElement).appendChild(box);
  }
  if (box.textContent.indexOf(msg) >= 0) return;
  box.style.display = 'block';
  box.textContent += msg + '\n';
};
window.addEventListener('error', function (e) {
  var m = String(e.message || '');
  var hint = /end of|EOF|Unexpected end/i.test(m) ? '\n→ 코드가 중간에 잘렸어요. 1부·2부·3부를 모두 이어 붙였는지 확인해 주세요.' : '';

const P = { x: 16, y: 15, px: 256, py: 240, nx: 16, ny: 15, dir: 'up', moving: false, t: 0, flip: false, idle: true, turnT: 0, spr: SPR.player };
const DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
let state = 'title', fading = false, modalOpen = false, bHeld = false, joyDir = null;
const keys = {};

function canWalk(map, x, y, self) {
  if (x < 0 || y < 0 || x >= map.w || y >= map.h || !WALK.has(map.grid[y][x])) return false;
  return ![P, ...map.npcs].some(e => e !== self && ((e.x === x && e.y === y) || (e.moving && e.nx === x && e.ny === y)));
}
function tryMove(e, dir, map) {
  e.dir = dir;
  const [dx, dy] = DIRV[dir], nx = e.x + dx, ny = e.y + dy;
  if (!canWalk(map, nx, ny, e)) return false;
  Object.assign(e, { moving: true, nx, ny, t: 0, flip: !e.flip });
  return true;
}
function advanceMove(e, dt, speed) {
  e.t += dt * speed;
  if (e.t >= 1) { Object.assign(e, { x: e.nx, y: e.ny, moving: false, t: 0, px: e.nx * 16, py: e.ny * 16 }); return true; }
  e.px = (e.x + (e.nx - e.x) * e.t) * 16; e.py = (e.y + (e.ny - e.y) * e.t) * 16;
  return false;
}
const locked = () => state !== 'play' || dlg.active || modalOpen || fading;
function inputDir() {
  if (joyDir) return joyDir;
  if (keys.arrowup || keys.w) return 'up';
  if (keys.arrowdown || keys.s) return 'down';
  ifft || keys.a) return 'left';
  if (keys.arrowright || keys.d) return 'right';
  return null;
}
function updatePlayer(dt) {
  if (P.moving) {
    if (!advanceMove(P, dt, (keys.shift || bHeld) ? 8 : 4.5)) return;
    if (checkTrigger()) return;
  }
  if (locked()) return;
  const d = inputDir();
  if (!d) { P.idle = true; return; }
  if (P.idle && d !== P.dir) { P.dir = d; P.turnT = 0.1; P.idle = false; return; }
  P.idle = false;
  if (P.turnT > 0) { P.turnT -= dt; return; }
  tryMove(P, d, cur);
}
function checkTrigger() {
  const c = cur.grid[P.y][P.x];
  if (cur.id === 'town' && c === 'D') { goMap('house', P.x - 10, 8, 'up'); return true; }
  if (cur.id === 'town' && c === 'G') { goMap('bamboo', 9, 15, 'up'); return true; }
  if (cur.id === 'house' && c === 'E') { goMap('town', P.x + 10, 13, 'down'); return true; }
  if (cur.id === 'bamboo' && c === 'Q') { goMap('town', 5, 13, 'down'); return true; }
  return false;
}
function goMap(id, x, y, dir) {
  fading = true; sfx('door'); $('fade').style.opacity = 1;
  setTimeout(() => {
    cur = MAPS[id];
    Object.assign(P, { x, y, nx: x, ny: y, px: x * 16, py: y * 16, dir, moving: false, idle: true });
    updateMusic();
    $('fade').style.opacity = 0;
    setTimeout(() => {
      fading = false;
      if (cur.welcome && !cur.visited) { cur.visited = true; say(cur.welcome); }
    }, 260);
  }, 260);
}
function updateNPCs(dt) {
  for (const n of cur.npcs) {
    if (n.moving) { advanceMove(n, dt, 3); continue; }
    if (n.talking || n.stay) continue;
    n.timer -= dt;
    if (n.timer > 0) continue;
    n.timer = 1.5 + Math.random() * 2.5;
    const d = ['up', 'down', 'left', 'right'][Math.random() * 4 | 0], dv = DIRV[d];
    if (Math.abs(n.x + dv[0] - n.home.x) <= 3 && Math.abs(n.y + dv[1] - n.home.y) <= 2) tryMove(n, d, cur); else n.dir = d;
  }
}

/* =========================================================
   7. 대화 · 상호작용
   ========================================================= */
const dlg = { active: false, lines: [], i: 0, shown: 0, full: '', done: null };
const actOn = a => !a.cond || a.cond();
function say(lines, done) {
  Object.assign(dlg, { active: true, lines, i: 0, done });
  dlg.full = lines[0]; dlg.shown = 0;
  $('dialog').classList.add('show');
}
function advance() {
  if (dlg.shown < dlg.full.length) { dlg.shown = dlg.full.length; return; }
  if (++dlg.i >= dlg.lines.length) {
    dlg.active = false; $('dialog').classList.remove('show');
    const d = dlg.done; dlg.done = null; if (d) d();
  } else { dlg.full = dlg.lines[dlg.i]; dlg.shown = 0; }
}
function facing() {
  const dv = DIRV[P.dir], fx = P.x + dv[0], fy = P.y + dv[1];
  const n = cur.npcs.find(n => n.x === fx && n.y === fy);
  if (n) return { kind: 'npc', npc: n };
  return cur.acts.find(a => actOn(a) && fx >= a.x && fx < a.x + a.w && fy >= a.y && fy < a.y + a.h) || null;
}
function interact(a) {
  sfx('kind === 'npc') {
    const n = a.npc, dx = P.x - n.x, dy = P.y - n.y;
    n.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    n.talking = true; say(n.lines, () => { n.talking = false; if (n.stay) n.dir = n.baseDir; });
  } else if (a.kind === 'archive') openArchive(a.key);
  else if (a.kind === 'dialog' || a.kind === 'talk') say(a.lines);
  else if (a.kind === 'contact') openContact();
  else if (a.kind === 'insta') openInsta();
}
function pressA() {
  if (state === 'title') return start();
  if (modalOpen) return;
  if (dlg.active) { sfx('a'); return advance(); }
  if (fading || P.moving) return;
  const f = facing(); if (f) interact(f);
}
function pressB() { if (modalOpen) closeModal(); else if (dlg.active) advance(); }

function openArchive(key) {

        ${imgs.length ? `<img src="${esc(imgs[i])}" alt="${esc(a.title)} 이미지 ${i + 1}">`
                      : `<div class="empty">아직 등록된 이미지가 없어요<br>ARCHIVE의 images에 사진 경로를 넣어 주세요</div>`}
        ${imgs.length > 1 ? `<button class="nav prev" aria-label="이전">◀</button><button class="nav next" aria-label="다음">▶</button><div class="count">${i + 1} / ${imgs.length}</div>` : ''}
      </div>
      ${a.date ? `<div class="meta">${esc(a.date)}</div>` : ''}
      <p class="desc">${esc(a.desc)}</p>
      <div class="actions">
        ${a.post ? `<a class="btn primary" href="${esc(a.post)}" target="_blank" rel="noopener">인스타 게시물 보기 ▶</a>` : ''}
        <a class="btn ${a.post ? '' : 'primary'}" href="${SITE.insta}" target="_blank" rel="noopener">인스타 계정 보기</a>
        <button class="btn close">닫기</button>
      </div>`;
    const v = sheet.querySelector('.viewer');
    const pv = v.querySelector('.prev'), nx = v.querySelector('.next');
    if (pv) pv.addEventListener('click', () => go(-1));
    if (nx) nx.addEventListener('click', () => go(1));
    let sx = null;
    v.addEventListener('touchstart', e => sx = e.touches[0].clientX, { passive: true });
    v.addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1); sx = null; });
    bindClose();
  };
  draw(); showModal(); modalNav = go;
}
function openInsta() {

    <div class="no">PC · INSTAGRAM</div>
    <h2>${esc(SITE.instaId)}</h2>
    <p class="desc">PC를 켰다! 머리 닿는 집의 인스타그램 기록을 볼 수 있어요.</p>
    <div class="actions"><a class="btn primary" href="${SITE.insta}" target="_blank" rel="noopener">인스타그램 열기 ▶</a><button class="btn close">닫기</button></div>
    <div id="feed"></div>`;

    if (window.instgrm) window.instgrm.Embeds.process();

  } else feed.innerHTML = `<p class="hint">INSTA_POSTS에 게시물 주소를 넣으면 여기에 피드가 표시돼요.</p>`;

}
function openContact() {

    <div class="no">MAILB</div>

    <div class="actions" style="flex-direction:column;align-items:stretch">

function openList() {
  if (state !== 'play' || fading) return;
  sheet.innerHTML = `
    <div class="no">MENU</div><h2>아카이브 목록</h2>
    <div class="list">
      ${Object.entries(ARCHIVE).map(([k, a]) => `<button class="btn" data-k="${k}"><span>${esc(a.no)}</span>${esc(a.title)}</button>`).join('')}
      <button class="btn" data-k="__insta"><span>IG</span>인스타그램</button>
      <button class="btn" data-k="__contact"><span>✉</span>컨택트</button>
    </div>
    <div class="actions"><button class="btn close">닫기</button></div>`;
  sheet.querySelectorAll('[data-k]').forEach(b => b.onclick = b.dataset.k; sfx('a');
    if (k === '__insta') openInsta(); else if (k === '__contact') openContact(); else openArchive(k);
  });

}

/* =========================================================
   9. 시간대
   ========================================================= */
const TIME_MODES = ['auto', 'day', 'sunset', 'night'];
const TIME_LABEL = { auto: '자동', day: '낮', sunset: '노을', night: '밤' };
const TINT = { day: [255, 255, 255, 0], sunset: [255, 190, 150, 0.45], night: [96, 104, 176, 1] };
let timeMode = 'auto', tint = [255, 255, 255, 0], lastPhase = '';
function phase() {
  if (timeMode !== 'auto') return timeMode;
  const h = new Date().getHours();
  if (h >= 6 && h < 17) return 'day';
  if ((h >= 17 && h < 19) || h === 5) return 'sunset';
  return 'night';
}
function updateClock() {
  const d = new Date(), hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  $('timeBtn').textContent = timeMode === 'auto' ? `${hm} ${TIME_LABEL[phase()]}` : TIME_LABEL[timeMode];
}
$('timeBtn').onclick = () => { timeMode = TIME_MODES[(TIME_MODES.indexOf(timeMode) + 1) % 4]; sfx('a'); updateClock(); };
setInterval(updateClock, 10000); updateClock();

/* =========================================================
   10. 음악 · 효과음
   ========================================================= */
let actx = null, master = null, gains = [], loopTimer = null, curTrack = null, soundOn = true;
const NI = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
const freq = n => 440 * Math.pow(2, (NI[n.slice(0, -1)] + (+n.slice(-1) - 4) * 12 - 9) / 12);
const parse = s => { let t = 0; return s.trim().split(/\s+/).map(tok => { const p = tok.split('.'); const e = { n: p[0], t, l: +p[1] }; t += +p[1]; return e; }); };
const TOWN_LEAD = 'C5.2 E5.2 G5.2 E5.2 F5.2 A5.2 G5.4 E5.2 G5.2 C6.2 B5.1 A5.1 G5.6 r.2 A5.2 G5.2 F5.2 E5.2 D5.2 E5.2 F5.4 E5.2 D5.2 C5.2 D5.2 C5.6 r.2';
const TOWN_BASS = 'C3.2 G3.2 C3.2 G3.2 F2.2 C3.2 F2.2 C3.2 C3.2 G3.2 C3.2 G3.2 G2.2 D3.2 G2.2 D3.2 F2.2 C3.2 F2.2 C3.2 G2.2 D3.2 G2.2 D3.2 C3.2 G3.2 G2.2 B2.2 C3.2 G3.2 C3.4';
const HOUSE_LEAD = 'G4.3 A4.1 B4.2 D5.2 C5.4 B4.2 A4.2 G4.2 E4.2 F4.2 A4.2 G4.8 A4.3 B4.1 C5.2 E5.2 D5.4 C5.2 B4.2 A4.2 F4.2 G4.2 B4.2 C5.8';
const HOUSE_BASS = 'G2.4 D3.4 A2.4 E3.4 C3.4 F2.4 G2.4 D3.4 F2.4 C3.4 G2.4 B2.4 F2.4 G2.4 C3.8';
const CAMP_LEAD = 'D5.2 B4.2 G4.2 B4.2 C5.4 A4.4 B4.2 G4.2 E4.2 G4.2 D4.8 E4.2 G4.2 A4.2 B4.2 C5.4 E5.4 D5.3 C5.1 B4.2 A4.2 G4.8';
const CAMP_ARP = 'G2.2 D3.2 G3.2 D3.2 A2.2 E3.2 C3.2 E3.2 G2.2 D3.2 G3.2 D3.2 G2.2 D3.2 B2.2 D3.2 C3.2 G3.2 C4.2 G3.2 A2.2 E3.2 A3.2 E3.2 D3.2 A3.2 F#3.2 A3.2 G2.2 D3.2 G3.4';
const TRACKS = {
  town:  { bpm: 124, parts: [{ wave: 'square', vol: .05, ev: parse(TOWN_LEAD) }, { wave: 'triangle', vol: .14, ev: parse(TOWN_BASS) }] },
  night: { bpm: 92,  parts: [{ wave: 'square', vol: .035, ev: parse(TOWN_LEAD) }, { wave: 'triangle', vol: .12, ev: parse(TOWN_BASS) }] },
  house: { bpm: 100, parts: [{ wave: 'square', vol: .045, ev: parse(HOUSE_LEAD) }, { wave: 'triangle', vol: .13, ev: parse(HOUSE_BASS) }] },
  camp:  { bpm: 84,  parts: [{ wave: 'triangle', vol: .14, ev: parse(CAMP_LEAD) }, { wave: 'square', vol: .025, ev: parse(CAMP_ARP) }] }
};
function tone(dest, type, f, t, d, v) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01);
  g.gain.setValueAtTime(v, t + d * 0.7); g.gain.linearRampToValueAtTime(0, t + d);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + d + 0.02);
}
function scheduleLoop(t0) {
  const tr = TRACKS[curTrack], step = 60 / tr.bpm / 2;
  const g = actx.createGain(); g.connect(master); gains.push(g); if (gains.length > 3) gains.shift();
  let len = 0;
  for (const p of tr.parts) for (const e of p.ev) { len = Math.max(len, e.t + e.l); if (e.n !== 'r') tone(g, p.wave, freq(e.n), t0 + e.t * step, e.l * step * 0.85, p.vol); }
  const end = t0 + len * step;
  loopTimer = setTimeout(() => scheduleLoop(end), Math.max(0, (end - actx.currentTime - 0.4) * 1000));
}
function stopMusic() {
  clearTimeout(loopTimer);
  const now = actx.currentTime;
  gains.forEach(g => { g.gain.setValueAtTime(g.gain.value, now); g.gain.linearRampToValueAtTime(0, now + 0.15); setTimeout(() => g.disconnect(), 300); });
  gains = [];
}
function playTrack(name) {
  if (!actx || (name === curTrack && gains.length)) return;
  if (gains.length) stopMusic();
  curTrack = name; scheduleLoop(actx.currentTime + 0.2);
}
function updateMusic() {
  playTrack(cur.id === 'house' ? 'house' : cur.id === 'bamboo' ? 'camp' : (phase() === 'night' ? 'night' : 'town'));
}
function sfx(type) {
  if (!actx || !soundOn) return;
  const t = actx.currentTime;
  if (type === 'a') { tone(master, 'square', freq('A5'), t, 0.05, 0.05); tone(master, 'square', freq('E6'), t + 0.05, 0.06, 0.05); }
  if (type === 'door') { tone(master, 'square', freq('C5'), t, 0.08, 0.05); tone(master, 'square', freq('G4'), t + 0.08, 0.12, 0.05); }
  if (type === 'close') tone(master, 'square', freq('E5'), t, 0.05, 0.04);
}
function initAudio() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); master = actx.createGain(); master.gain.value = soundOn ? 0.6 : 0; master.connect(actx.destination);
  if (actx.resume) actx.resume();
}
$('sndBtn').onclick = () => {
  soundOn = !soundOn; initAudio();
  if (master) master.gain.value = soundOn ? 0.6 : 0;
  $('sndBtn').textContent = soundOn ? '♪ ON' : '♪ OFF';
  if (state === 'play') updateMusic();
};

/* =========================================================
   11. 입력
   ========================================================= */
function start() {
  if (state !== 'title') return;
  state = 'play'; $('title').classList.add('hide');
  initAudio(); updateMusic();
}
['touchend', 'click'].forEach(ev =>
  $('title').addEventListener(ev, e => { e.preventDefault(); start(); }, { passive: false })
);
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  keys[k] = true;
  if (e.repeat) return;
  if (state === 'title') return start();
  if (modalOpen && modalNav && (k === 'arrowleft' || k === 'arrowright')) return modalNav(k === 'arrowleft' ? -1 : 1);
  if (['z', 'enter', ' ', 'e'].includes(k)) pressA();
  if (k === 'x' || k === 'escape') pressB();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const joy = $('joy'), knob = $('knob'); let joyId = null;
function moveJoy(e) {
  const r = joy.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const d = Math.hypot(dx, dy), max = 34;
  if (d > max) { dx *= max / d; dy *= max / d; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  joyDir = d < 12 ? null : (Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
}
joy.addEventListener('pointerdown', e => { joyId = e.pointerId; joy.setPointerCapture(e.pointerId); moveJoy(e); });
joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) moveJoy(e); });
const endJoy = e => { if (e.pointerId !== joyId) return; joyId = null; joyDir = null; knob.style.transform = ''; };
joy.addEventListener('pointerup', endJoy); joy.addEventListener('pointercancel', endJoy);

$('btnA').addEventListener('pointerdown', e => { e.preventDefault(); pressA(); });
$('btnB').addEventListener('pointerdown', e => { e.preventDefault(); bHeld = true; pressB(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => $('btnB').addEventListener(ev, () => bHeld = false));
$('dialog').addEventListener('click', () => { sfx('a'); advance(); });
$('prompt').addEventListener('click', pressA);
$('listBtn').onclick = () => { sfx('a'); openList(); };ener('pointerup', e => {
  if (locked()) return;
  const tx = Math.floor((e.clientX / scale + cam.x) / 16), ty = Math.floor((e.clientY / scale + cam.y) / 16);
  const n = cur.npcs.find(n => n.x === tx && (n.y === ty || n.y === ty + 1));
  if (n) return interact({ kind: 'npc', npc: n });
  const a = cur.acts.find(a => actOn(a) && tx >= a.x && tx < a.x + a.w && ty >= a.y - (a.up || 0) && ty < a.y + a.h);
  if (a) interact(a);
});

/* =========================================================
   12. 화면 · 렌더링
   ========================================================= */
let scale = 2;
const cam = { x: 0, y: 0 };
function resize() {
  scale = Math.max(2, Math.floor(Math.min(innerWidth, innerHeight) / 150));
  cv.width = Math.ceil(innerWidth / scale); cv.height = Math.ceil(innerHeight / scale);
  cv.style.width = cv.width * scale + 'px'; cv.style.height = cv.height * scale + 'px';
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize); resize();

const LABEL = { archive: '프로젝트 보기', dialog: '읽기', npc: '말 걸기', talk: '말 걸기', contact: '편지 보내기', insta: '인스타그램 보기' };
let hudKey = null, promptLabel = null;
function updateHUD() {
  let near = null, best = 99;
  for (const a of cur.acts) {
    if (a.kind !== 'archive') continue;
    const dx = Math.max(a.x - P.x, 0, P.x - (a.x + a.w - 1)), dy = Math.max(a.y - P.y, 0, P.y - (a.y + a.h - 1));
    if (dx + dy <= 2 && dx + dy < best) { best = dx + dy; near = a; }
  }
  const key = near ? near.key : '';
  if (key !== hudKey) {
    hudKey = key;
    if (near) $('tag').innerHTML = `<small>PROJECT ${esc(ARCHIVE[key].no)}</small><b>${esc(ARCHIVE[key].title)}</b>`;
    $('tag').classList.toggle('show', !!near);
  }
  const f = (!locked() && !P.moving) ? facing() : null, label = f ? LABEL[f.kind] : '';
  if (label !== promptLabel) {
    promptLabel = label;
    $('prompt').querySelector('span').textContent = label;
    $('prompt').classList.toggle('show', !!label);
  }
}
const frameOf = e => !e.moving ? 0 : (e.t < 0.5 ? (e.flip ? 1 : 2) : 0);
function drawEnt(e) {
  const x = Math.round(e.px - cam.x), y = Math.round(e.py - cam.y);
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(x + 3, y + 13, 10, 3);
  ctx.drawImage(e.spr[e.dir][frameOf(e)], x, y - 4);
}
function drawSeaFX(t) {
  const m = cur.grid, at = (x, y) => (m[y] && m[y][x]) || 'S';
  const x0 = Math.max(0, Math.floor(cam.x / 16)), y0 = Math.max(0, Math.floor(cam.y / 16));
  const x1 = Math.min(cur.w - 1, Math.floor((cam.x + cv.width) / 16)), y1 = Math.min(cur.h - 1, Math.floor((cam.y + cv.height) / 16));
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (m[ty][tx] !== 'S') continue;
    const X = tx * 16 - cam.x, Y = ty * 16 - cam.y, h = hsh(tx, ty);
    const s1 = Math.floor(t * 5 + (h % 16)) % 16, s2 = 15 - Math.floor(t * 4 + ((h >> 5) % 16)) % 16;
    R(ctx, '#8fe3d8', X + s1, Y + 3 + (h % 3), 3, 1);
    R(ctx, '#2f9aa0', X + s2, Y + 10 + ((h >> 3) % 3), 4, 1);
    const w = (wave(t, tx * 16 + 8) + 1) / 2;
    if (at(tx, ty - 1) !== 'S') {
      const p = Math.round(w * 5);
      R(ctx, '#9be6dc', X, Y, 16, 7 - p);
      R(ctx, '#f0fffb', X, Y + 6 - p, 16, 1);
      for (let i = (tx * 5) % 4; i < 16; i += 4) R(ctx, '#f0fffb', X + i, Y + 7 - p, 2, 1);
      if (w > 0.85) for (let i = 1; i < 16; i += 5) R(ctx, '#ffffff', X + i, Y - 1, 2, 1);
      const p2 = Math.round(((wave(t - 1.2, tx * 16 + 8) + 1) / 2) * 4);
      R(ctx, '#c8f4ee', X + ((tx * 3) % 5), Y + 13 - p2, 8, 1);
    }
    if (at(tx - 1, ty) !== 'S') R(ctx, '#e8fbf6', X + Math.round(w * 2), Y, 1, 16);
    if (at(tx + 1, ty) !== 'S') R(ctx, '#e8fbf6', X + 15 - Math.round(w * 2), Y, 1, 16);
  }
}
function render(t) {
  const vw = cv.width, vh = cv.height, mw = cur.w * 16, mh = cur.h * 16;
  cam.x = mw > vw ? Math.max(0, Math.min(mw - vw, Math.round(P.px + 8 - vw / 2))) : Math.round((mw - vw) / 2);
  cam.y = mh > vh ? Math.max(0, Math.min(mh - vh, Math.round(P.py + 8 - vh / 2))) : Math.round((mh - vh) / 2);
  ctx.fillStyle = cur.bg || '#000'; ctx.fillRect(0, 0, vw, vh);
  ctx.drawImage(cur.ground, -cam.x, -cam.y);
  if (cur.sea) { try { drawSeaFX(t); } catch (err) { window.showErr('바다 효과 오류: ' + err.message); } }

  const list = [...cur.objects, ...[P, ...cur.npcs].map(e => ({ ent: e, base: e.py + 16 }))].sort((a, b) => a.base - b.base);
  for (const o of list) {
    if (o.broken) continue;
    try {
      if (o.ent) drawEnt(o.ent);
      else if (o.draw) o.draw(ctx, o.x - cam.x, o.y - cam.y, t);
      else {
        const x = o.x - cam.x, y = o.y - cam.y;
        if (x > vw || y > vh || x + o.img.width < 0 || y + o.img.height < 0) continue;
        ctx.drawImage(o.img, x, y);
      }
    } catch (err) {
      o.broken = true;                                  // 고장 난 그림 하나만 건너뛰고 게임은 계속
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      window.showErr('그림 오류: ' + err.message);
    }
  }

  if (cur.id === 'bamboo') {
    const fx = 144 - cam.x, fy = 144 - cam.y;
    const g = ctx.createRadialGradient(fx, fy, 40, fx, fy, 150);
    g.addColorStop(0, 'rgba(10,18,8,0)'); g.addColorStop(1, 'rgba(10,18,8,0.6)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);
  }

  if (tint[0] < 254 || tint[1] < 254 || tint[2] < 254) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgb(' + (tint[0] | 0) + ',' + (tint[1] | 0) + ',' + (tint[2] | 0) + ')';
    ctx.fillRect(0, 0, vw, vh);
    ctx.globalCompositeOperation = 'lighter';
    for (const L of cur.lights) {
      const fl = L.flicker ? 1 + Math.sin(t * 9) * 0.04 + Math.sin(t * 23) * 0.03 : 1;
      const r = Math.max(1, L.r * fl), x = L.x - cam.x, y = L.y - cam.y;
      const a = Math.max(0, Math.min(1, (L.a || 0.55) * tint[3])).toFixed(3), col = L.color || '255,190,110';
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(' + col + ',' + a + ')'); g.addColorStop(1, 'rgba(' + col + ',0)');
      ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    ctxperation = 'source-over';
  }
}
function update(dt) {
  updatePlayer(dt);
  updateNPCs(dt);
  if (dlg.active) { dlg.shown = Math.min(dlg.full.length, dlg.shown + dt * 40); $('dtext').textContent = dlg.full.slice(0, dlg.shown | 0); }
  const ph = phase();
  let tp = TINT[ph];
  if (cur.id === 'house') tp = ph === 'night' ? [215, 205, 230, 0.5] : ph === 'sunset' ? [255, 235, 215, 0.2] : [255, 255, 255, 0];
  else if (cur.id === 'bamboo') tp = ph === 'night' ? [64, 66, 110, 1] : [245, 165, 125, 0.85];
  tint = tint.map((v, i) => v + (tp[i] - v) * Math.min(1, dt * 2));
  if (ph !== lastPhase) { lastPhase = ph; if (state === 'play') updateMusic(); updateClock(); }
  updateHUD();
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try { update(dt); render(now / 1000); }
  catch (err) { ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; window.showErr('오류: ' + err.message); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
