<script>
window.showErr = function (msg) {
  var box = document.getElementById('errbox');
  if (!box) {
    box = document.createElement('div');
    box.id = 'errbox';
    box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#c00;color:#fff;font:13px/1.6 sans-serif;padding:10px;white-space:pre-wrap;max-height:50vh;overflow:auto';
    box.onclick = function () { box.style.display = 'none'; };
    (document.body || document.documentElement).appendChild(box);
  }
  if (box.textContent.indexOf(msg) >= 0) return;
  box.style.display = 'block';
  box.textContent += msg + '\n';
};
window.addEventListener('error', function (e) {
  var line = e.lineno || 0;
  window.showErr('오류: ' + (e.message || '') + ' (' + (line || '?') + '행)\n이 화면을 캡처해서 보내 주세요. (빨간 박스를 누르면 닫혀요)');
  if (!line || !window.fetch) return;
  fetch(location.href, { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (src) {
    var rows = src.split('\n');
    var endMark = 'ROOFTOUCH' + '-END';
    var docMark = '<' + '!DOCTYPE';
    var ends = src.split(endMark).length - 1;
    var docs = src.split(docMark).length - 1;
    var info = '문제 줄 내용: ' + String(rows[line - 1] || '').trim().slice(0, 160) + '\n파일 전체 ' + rows.length + '줄';
    if (docs > 1) info += '\n→ 코드가 두 번 들어가 있어요. 전부 지운 뒤 한 번만 붙여넣어 주세요.';
    if (ends < 1) info += '\n→ 코드 끝부분이 잘렸어요. 마지막 줄까지 다 붙여넣어 주세요.';
    window.showErr(info);
  }).catch(function () {});
});
</script>

<style>

<script>
/* =========================================================
   1. 내 정보 · 아카이브 (이 부분만 고치면 내용이 바뀝니다)
   ========================================================= */
const SITE = {

const INSTA_POSTS = [];

const ARCHIVE = {
  hallasan: { no: '머리닿는 집', type: '제주', title: '한라산 원정대', date: '2026년 3월', images: [], post: '',
              desc: '사람들을 모아 눈덮인 한라산을 오른 기록입니다.' },
  camp:     { no: '숨섬쉼', type: '제주', title: '대나무숲 바베큐', date: '2025년 여름', images: [], post: '',
              desc: '아무도 없는 경주마 목장 속 대나무 숲에서 우리들만의 바베큐와 캠프파이어.' },
  goods:    { no: '숨섬쉼', type: '서울', title: '클로징파티', date: '2025년 11월', images: [], post: '',
              desc: '직접 만든 굿즈 아직도 다 안팔림.\n구매문의 DM 주세요...' },
  work1:    { no: '04', type: '오프라인 프로젝트', title: '개인 프로젝트 1', date: '', images: [], post: '', desc: '(설명을 입력하세요)' },
  work2:    { no: '05', type: '오프라인 프로젝트', title: '개인 프로젝트 2', date: '', images: [], post: '', desc: '(설명을 입력하세요)' },
  work3:    { no: '06', type: '오프라인 프로젝트', title: '개인 프로젝트 3', date: '', images: [], post: '', desc: '(설명을 입력하세요)' },
  work4:    { no: '07', type: '오프라인 프로젝트', title: '개인 프로젝트 4', date: '', images: [], post: '', desc: '(설명을 입력하세요)' },
  books:    { no: '08', type: '기록', title: '기록집 · 자료', date: '', images: [], post: '', desc: '(설명을 입력하세요)' },
  table:    { no: '09', type: '소품', title: '소품 · 샘플', date: '', images: [], post: '', desc: '(설명을 입력하세요)' }
};

/* =========================================================
   2. 기본 도구
   ========================================================= */
const $ = function (id) { return document.getElementById(id); };
const cv = $('game');
const ctx = cv.getContext('2d');
function R(g, c, x, y, w, h) {
  g.fillStyle = c;
  g.fillRect(x, y, w === undefined ? 1 : w, h === undefined ? 1 : h);
}
function hsh(x, y) { return ((x * 73856093) ^ (y * 19349663)) >>> 0; }
function wave(t, wx) { return Math.sin(t * 1.4 - wx * 0.022); }
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return { c: c, g: g };
}
// '1,2 3,4' 같은 글자를 좌표 목록으로 바꿈
function pts(s) {
  return s.split(' ').map(function (q) { const p = q.split(','); return { x: Number(p[0]), y: Number(p[1]) }; });
}
// 화면 요소 만들기 도구
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function makeLink(cls, href, text) {
  const a = el('a', cls, text);
  a.href = href; a.target = '_blank'; a.rel = 'noopener';
  return a;
}
function makeBtn(cls, text, fn) {
  const b = el('button', cls, text);
  b.type = 'button';
  b.onclick = fn;
  return b;
}
if (matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window) document.body.classList.add('touch');
const isTouch = document.body.classList.contains('touch');
$('key').textContent = isTouch ? 'A' : 'Space';

/* =========================================================
   3. 캐릭터 스프라이트 (16x16 픽셀)
   ========================================================= */
const HEAD = {
  down: '.....KKKKKK.....|....KOOOOOOK....|...KOOOWWOOOK...|...KOOOOOOOOK...|..KKKKKKKKKKKK..|...KHHSSSSHHK...|...KHSKSSKSHK...|...KSSSSSSSSK...|....KSSSSSSK....|...KTTTWWTTTK...|..KSTTTWWTTTSK..|..KSKTTTTTTKSK..|...KKNNNNNNKK...',
  up:   '.....KKKKKK.....|....KOOOOOOK....|...KOOOOOOOOK...|...KOOOOOOOOK...|..KKKKKKKKKKKK..|...KHHHHHHHHK...|...KHHHHHHHHK...|...KHHHHHHHHK...|....KHHHHHHK....|...KTTTTTTTTK...|..KSTTTTTTTTSK..|..KSKTTTTTTKSK..|...KKNNNNNNKK...',
  side: '.....KKKKKK.....|....KOOOOOOK....|...KOOOOOWWOK...|...KOOOOOOOOK...|...KKKKKKKKKKKK.|...KHHHHSSSK....|...KHHHSSKSK....|...KHHSSSSSK....|....KHSSSSK.....|....KTTTTTK.....|....KTTSSTK.....|....KTTSSTK.....|....KNNNNNK.....'
};
const LEGS = {
  down: {
    stand: '....KNNKKNNK....|....KNNKKNNK....|....KKK..KKK....',
    a:     '....KNNKKNNK....|....KNNK.KKK....|....KKK.........',
    b:     '....KNNKKNNK....|....KKK.KNNK....|.........KKK....'
  },
  side: {
    stand: '....KNNNNK......|....KNNNNK......|....KKKKKK......',
    a:     '...KNNK.KNK.....|..KNNK...KNK....|..KKK.....KKK...'
  }
};
LEGS.side.b = LEGS.side.stand;

function buildChar(pal) {
  const out = {};
  ['down', 'up', 'left', 'right'].forEach(function (dir) {
    const base = (dir === 'left' || dir === 'right') ? 'side' : dir;
    const legs = (base === 'side') ? LEGS.side : LEGS.down;
    out[dir] = ['stand', 'a', 'b'].map(function (f) {
      const k = makeCanvas(16, 16);
      const lines = (HEAD[base] + '|' + legs[f]).split('|');
      lines.forEach(function (row, y) {
        for (let x = 0; x < row.length; x++) {
          const ch = row.charAt(x);
          if (ch !== '.') R(k.g, pal[ch], dir === 'left' ? 15 - x : x, y);
        }
      });
      return k.c;
    });
  });
  return out;
}
const BASE_PAL = { K: '#282830', W: '#f8f8f8', S: '#f8c8a0', N: '#384068' };
function palette(extra) { return Object.assign({}, BASE_PAL, extra); }
const SPR = {
  player: buildChar(palette({ O: '#f05a1e', H: '#503828', T: '#3070d0' })),
  npc1:   buildChar(palette({ O: '#48a048', H: '#303030', T: '#e8b830' })),
  npc2:   buildChar(palette({ O: '#8858c8', H: '#a06030', T: '#e86878' }))
};

/* =========================================================
   4. 오브젝트 스프라이트
   ========================================================= */
const GLYPH = {
  R: '####.|#...#|####.|#..#.|#...#', O: '.###.|#...#|#...#|#...#|.###.', F: '#####|#....|####.|#....|#....',
  T: '#####|..#..|..#..|..#..|..#..', U: '#...#|#...#|#...#|#...#|.###.', C: '.####|#....|#....|#....|.####',
  H: '#...#|#...#|#####|#...#|#...#', S: '.####|#....|.###.|....#|####.', E: '#####|#....|####.|#....|#####',
  G: '.####|#....|#..##|#...#|.###.', D: '####.|#...#|#...#|#...#|####.'
};
function drawText(g, str, cx, y, s, color) {
  s = s || 2; color = color || '#202020';
  const total = str.length * 6 * s - s;
  let x = Math.round(cx - total / 2);
  for (let k = 0; k < str.length; k++) {
    const rows = GLYPH[str.charAt(k)].split('|');
    rows.forEach(function (row, j) {
      for (let i = 0; i < row.length; i++) if (row.charAt(i) === '#') R(g, color, x + i * s, y + j * s, s, s);
    });
    x += 6 * s;
  }
}
function makeHouse() {
  const k = makeCanvas(96, 98), g = k.g;
  const OR = '#f05a1e', ORD = '#b83a10', K = '#202020', WH = '#ffffff';
  for (let y = 2; y <= 37; y++) {
    const half = Math.round((y - 2) * 47 / 35), x0 = 48 - half, x1 = 48 + half;
    R(g, ORD, x0 - 1, y, x1 - x0 + 2, 1);
    R(g, OR, x0, y, x1 - x0, 1);
    if (x1 - x0 > 8) R(g, WH, x0 + 4, y, x1 - x0 - 8, 1);
  }
  R(g, K, 0, 36, 14, 3); R(g, K, 82, 36, 14, 3);
  R(g, WH, 14, 38, 68, 57);
  R(g, '#e8e8e8', 76, 38, 5, 57);
  R(g, K, 11, 36, 3, 62); R(g, K, 82, 36, 3, 62); R(g, K, 11, 95, 74, 3);
  drawText(g, 'ROOF', 48, 26); drawText(g, 'TOUCH', 48, 40); drawText(g, 'HOUSE', 48, 54);
  R(g, K, 35, 68, 26, 27); R(g, '#8a5a30', 37, 70, 22, 25);
  R(g, '#9ad0f0', 39, 72, 8, 7); R(g, '#9ad0f0', 49, 72, 8, 7);
  R(g, K, 47, 70, 2, 25);
  R(g, '#f8d048', 44, 84, 2, 2); R(g, '#f8d048', 50, 84, 2, 2);
  return k.c;
}
function makeTree() {
  const k = makeCanvas(16, 24), g = k.g;
  R(g, '#7a4a28', 6, 19, 4, 5); R(g, '#5a3418', 6, 22, 4, 2);
  const tiers = [0, 6, 2, 8, 4, 12, 4, 12, 9, 19, 6, 16];
  for (let y = 0; y < 20; y++) {
    let w = 0;
    for (let q = 0; q < tiers.length; q += 4) {
      const a = tiers[q], b = tiers[q + 1], w0 = tiers[q + 2], w1 = tiers[q + 3];
      if (y >= a && y <= b) w = Math.max(w, Math.round((w0 + (w1 - w0) * (y - a) / (b - a)) / 2) * 2);
    }
    const x0 = 8 - w / 2;
    R(g, '#1f5a38', x0, y, w, 1);
    if (w > 2) { R(g, '#2f8a4f', x0 + 1, y, w - 2, 1); R(g, '#4fae62', x0 + 1, y, Math.max(1, Math.floor((w - 2) / 3)), 1); }
  }
  return k.c;
}
// 키 큰 대나무 (18x52)
function makeBamboo(v) {
  const k = makeCanvas(18, 52), g = k.g;
  const greens = ['#8fae6a', '#a6bd78', '#7a9a58', '#b4b884'];
  const stems = [1, 2, 6, 3, 11, 2, 15, 2];
  for (let i = 0; i < 4; i++) {
    const sx = stems[i * 2], w = stems[i * 2 + 1];
    const col = greens[(i + v) % 4], top = 4 + ((v * 3 + i * 5) % 7);
    R(g, '#2e4026', sx + w, top, 1, 52 - top);
    R(g, col, sx, top, w, 52 - top);
    if (w > 2) R(g, '#c8d49c', sx, top, 1, 52 - top);
    for (let y = top + 3 + ((i + v) % 4) * 2; y < 52; y += 10) {
      R(g, '#eef0d0', sx - (w > 2 ? 1 : 0), y, w + 1, 1);
      R(g, '#4a5e36', sx, y + 1, w, 1);
    }
  }
  const leafCols = ['#2f6a3a', '#4a8a44', '#6aa858', '#3a7a3e'];
  for (let i = 0; i < 24; i++) {
    const h = hsh(i + v * 31, v + 3);
    const lx = h % 16, ly = ((h >>> 6) % 20) + (i > 17 ? 16 : 0), d = (i % 2) ? 1 : -1, col = leafCols[(h >>> 3) % 4];
    R(g, col, lx, ly, 3, 1); R(g, col, lx + d, ly + 1, 3, 1);
  }
  return k.c;
}
function makeStall() {
  const k = makeCanvas(64, 44), g = k.g;
  R(g, '#6a4020', 3, 10, 3, 16); R(g, '#6a4020', 58, 10, 3, 16);
  for (let i = 0; i < 8; i++) {
    const col = (i % 2) ? '#ffffff' : '#f05a1e';
    R(g, col, i * 8, 1, 8, 11); R(g, col, i * 8 + 2, 12, 4, 1);
  }
  R(g, '#202020', 0, 0, 64, 1);
  R(g, '#58a0e0', 8, 18, 8, 7); R(g, '#f8d048', 20, 16, 6, 9); R(g, '#e85878', 30, 19, 10, 6); R(g, '#68c070', 46, 17, 7, 8);
  R(g, '#202020', 0, 24, 64, 20); R(g, '#c88848', 1, 25, 62, 18); R(g, '#a86830', 1, 25, 62, 3);
  R(g, '#fff8e0', 15, 30, 34, 9); drawText(g, 'GOODS', 32, 32, 1);

// 자연에서 그대로 잘라낸 통나무 그루터기 의자 (크기를 다르게)
function makeStump(wd, sideH, seed) {
  const topH = Math.round(wd * 0.55), H = topH + sideH + 1;
  const k = makeCanvas(wd, H), g = k.g;
  const rx = wd / 2, ry = topH / 2;
  function inTop(x, y) { const nx = (x + 0.5 - rx) / rx, ny = (y + 0.5 - ry) / ry; return nx * nx + ny * ny <= 1; }
  function inBot(x, y) { const nx = (x + 0.5 - rx) / rx, ny = (y + 0.5 - ry - sideH) / ry; return nx * nx + ny * ny <= 1; }
  function inside(x, y) {
    if (x < 0 || y < 0 || x >= wd || y >= H) return false;
    if (inTop(x, y) || inBot(x, y)) return true;
    const nx = (x + 0.5 - rx) / rx;
    return y >= ry && y <= ry + sideH && nx * nx <= 1;
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < wd; x++) {
    if (!inside(x, y)) continue;
    if (!inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1)) { R(g, '#3a2414', x, y); continue; }
    const nx = (x + 0.5 - rx) / rx;
    if (inTop(x, y)) {
      const ny = (y + 0.5 - ry) / ry, d = Math.sqrt(nx * nx + ny * ny);
      let c = '#d8b07a';
      if (!inTop(x, y + 1)) c = '#a07040';
      else if (d > 0.8) c = '#b88a52';
      else if (Math.abs(d - 0.5) < 0.11) c = '#a87a48';
      else if (d < 0.17) c = '#a87a48';
      else if (nx < -0.2 && ny < -0.2) c = '#e8c890';
      R(g, c, x, y);
    } else {
      let c = '#6a4424';
      if (nx < -0.5) c = '#8a5a30'; else if (nx > 0.55) c = '#503018';
      if (((x * 5 + seed * 3) % 4) === 0 && y > ry + 1) c = '#4e3018';
      R(g, c, x, y);
    }
  }
  return k.c;
}

function makeMonument() {
  // 세로로 긴 자연석에 '구두미 포구'를 새기고, 글씨 아래쪽은 흰색으로 칠한 비석
  const W = 18, H = 58, BODY = 55, cx = 9;

  const LINE = '#18181c', STONE = '#7c7a72', HI = '#98968c', SH = '#62605a';
  const L = [], RR = [];
  const TOP = [3, 5, 6, 6.3];
  for (let y = 0; y < BODY; y++) {
    const t = y / BODY;
    let hw = (y < 4) ? TOP[y] : 6.4 + 1.2 * Math.sin(Math.PI * Math.pow(t, 0.9)) + 0.9 * t * t + 0.3 * Math.sin(y * 0.7);

    if (RR[y] > RR[y - 1] && RR[y] > RR[y + 1]) RR[y] = Math.max(RR[y - 1], RR[y + 1]);
    if (L[y] < L[y - 1] && L[y] < L[y + 1]) L[y] = Math.min(L[y - 1], L[y + 1]);

  const inner = [];

function drawCampfire(g, x, y, t) {
  const cx = x + 16, cy = y + 22;

      R(g, '#1c1c20', sx, sy, 5, 4); R(g, '#3a3a40', sx + 1, sy, 3, 3); R(g, '#55555c', sx + 1, sy, 2, 1);
    }

  stones(false);
  R(g, '#3a2414', cx - 9, cy - 5, 18, 4); R(g, '#7a4c26', cx - 8, cy - 4, 16, 2);
  R(g, '#3a2414', cx - 3, cy - 7, 6, 7); R(g, '#8a5a30', cx - 2, cy - 6, 4, 5);
  for (let i = 0; i < 6; i++) if ((Math.floor(t * 7) + i) % 3) R(g, '#ff6a20', cx - 8 + i * 3, cy - 1, 2, 1);
  const fh = 17 + Math.round(Math.sin(t * 11) * 2 + Math.sin(t * 17) * 1.5);
  function layer(col, H, W) {
    for (let r = 0; r < H; r++) {
      const w = Math.max(1, Math.round(W * Math.sqrt(Math.max(0, 1 - r / H))));
      const sway = Math.round(Math.sin(t * 9 + r * 0.45) * (r / H) * 2.5);
      R(g, col, cx - Math.floor(w / 2) + sway, cy - 5 - r, w, 1);
    }
  }
  layer('#e0401a', fh, 14);
  layer('#f8902a', Math.round(fh * 0.72), 10);
  layer('#ffe07a', Math.round(fh * 0.42), 5);
  for (let n = 0; n < 6; n++) {
    const p = (t * 0.7 + n / 6) % 1;
    if (p > 0.92) continue;
    R(g, p < 0.5 ? '#ffd27a' : '#ff7a2a', cx + Math.round(Math.sin(n * 2.3 + t * 1.7) * (3 + p * 6)), cy - 10 - Math.round(p * 34), 1, 1);

/* =========================================================
   6. 플레이어 · 이동
   ========================================================= */
const P = { x: 16, y: 15, px: 256, py: 240, nx: 16, ny: 15, dir: 'up', moving: false, t: 0, flip: false, idle: true, turnT: 0, spr: SPR.player };
const DIRV = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
const DIRS = ['up', 'down', 'left', 'right'];
let state = 'title', fading = false, modalOpen = false, bHeld = false, joyDir = null;
const keys = {};

function canWalk(map, x, y, self) {
  if (WALK.indexOf(gget(map.grid, x, y)) < 0) return false;
  const all = [P].concat(map.npcs);
  for (let i = 0; i < all.length; i++) {
    const e = all[i];
    if (e === self) continue;
    if ((e.x === x && e.y === y) || (e.moving && e.nx === x && e.ny === y)) return false;
  }
  return true;
}
function tryMove(e, dir, map) {
  e.dir = dir;
  const dv = DIRV[dir], nx = e.x + dv.x, ny = e.y + dv.y;
  if (!canWalk(map, nx, ny, e)) return false;
  e.moving = true; e.nx = nx; e.ny = ny; e.t = 0; e.flip = !e.flip;
  return true;
}
function advanceMove(e, dt, speed) {
  e.t += dt * speed;
  if (e.t >= 1) {
    e.x = e.nx; e.y = e.ny; e.moving = false; e.t = 0; e.px = e.nx * 16; e.py = e.ny * 16;
    return true;
  }
  e.px = (e.x + (e.nx - e.x) * e.t) * 16;
  e.py = (e.y + (e.ny - e.y) * e.t) * 16;
  return false;
}
function locked() { return state !== 'play' || dlg.active || modalOpen || fading; }
function inputDir() {
  if (joyDir) return joyDir;
  if (keys.arrowup || keys.w) return 'up';
  if (keys.arrowdown || keys.s) return 'down';
  if (keys.arrowleft || keys.a) return 'left';
  if (keys.arrowright || keys.d) return 'right';
  return null;
}
function updatePlayer(dt) {
  if (P.moving) {
    if (!advanceMove(P, dt, (keys.shift || bHeld) ? 8 : 4.5)) return;
    if (checkTrigger()) return;
  }
  if (locked()) return;
  const d = inputDir();
  if (!d) { P.idle = true; return; }
  if (P.idle && d !== P.dir) { P.dir = d; P.turnT = 0.1; P.idle = false; return; }
  P.idle = false;
  if (P.turnT > 0) { P.turnT -= dt; return; }
  tryMove(P, d, cur);
}
function checkTrigger() {
  const c = gget(cur.grid, P.x, P.y);
  if (cur.id === 'town' && c === 'D') { goMap('house', P.x - 10, 8, 'up'); return true; }
  if (cur.id === 'town' && c === 'G') { goMap('bamboo', 9, 15, 'up'); return true; }
  if (cur.id === 'house' && c === 'E') { goMap('town', P.x + 10, 13, 'down'); return true; }
  if (cur.id === 'bamboo' && c === 'Q') { goMap('town', 5, 9, 'down'); return true; }
  return false;
}
function goMap(id, x, y, dir) {
  fading = true; sfx('door'); $('fade').style.opacity = 1;
  setTimeout(function () {
    cur = MAPS[id];
    P.x = x; P.y = y; P.nx = x; P.ny = y; P.px = x * 16; P.py = y * 16; P.dir = dir; P.moving = false; P.idle = true;
    updateMusic();
    $('fade').style.opacity = 0;
    setTimeout(function () {
      fading = false;
      if (cur.welcome && !cur.visited) { cur.visited = true; say(cur.welcome); }
    }, 260);
  }, 260);
}
function updateNPCs(dt) {
  cur.npcs.forEach(function (n) {
    if (n.moving) { advanceMove(n, dt, 3); return; }
    if (n.talking || n.stay) return;
    n.timer -= dt;
    if (n.timer > 0) return;
    n.timer = 1.5 + Math.random() * 2.5;
    const d = DIRS[Math.floor(Math.random() * 4)], dv = DIRV[d];
    if (Math.abs(n.x + dv.x - n.home.x) <= 3 && Math.abs(n.y + dv.y - n.home.y) <= 2) tryMove(n, d, cur);
    else n.dir = d;
  });
}

/* =========================================================
   7. 대화 · 상호작용
   ========================================================= */
const dlg = { active: false, lines: [], i: 0, shown: 0, full: '', done: null };
function actOn(a) { return !a.cond || a.cond(); }
function say(lines, done) {
  dlg.active = true; dlg.lines = lines; dlg.i = 0; dlg.done = done || null;
  dlg.full = lines[0]; dlg.shown = 0;
  $('dialog').classList.add('show');
}
function advance() {
  if (dlg.shown < dlg.full.length) { dlg.shown = dlg.full.length; return; }
  dlg.i += 1;
  if (dlg.i >= dlg.lines.length) {
    dlg.active = false; $('dialog').classList.remove('show');
    const d = dlg.done; dlg.done = null;
    if (d) d();
  } else {
    dlg.full = dlg.lines[dlg.i]; dlg.shown = 0;
  }
}
function findAct(fx, fy, useUp) {
  for (let i = 0; i < cur.acts.length; i++) {
    const a = cur.acts[i];
    const top = useUp ? a.y - (a.up || 0) : a.y;
    if (actOn(a) && fx >= a.x && fx < a.x + a.w && fy >= top && fy < a.y + a.h) return a;
  }
  return null;
}
function facing() {
  const dv = DIRV[P.dir], fx = P.x + dv.x, fy = P.y + dv.y;
  for (let i = 0; i < cur.npcs.length; i++) {
    const n = cur.npcs[i];
    if (n.x === fx && n.y === fy) return { kind: 'npc', npc: n };
  }
  return findAct(fx, fy, false);
}
function interact(a) {
  sfx('a');
  if (a.kind === 'npc') {
    const n = a.npc, dx = P.x - n.x, dy = P.y - n.y;
    n.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    n.talking = true;
    say(n.lines, function () { n.talking = false; if (n.stay) n.dir = n.baseDir; });
  } else if (a.kind === 'archive') openArchive(a.key);
  else if (a.kind === 'dialog' || a.kind === 'talk') say(a.lines);
  else if (a.kind === 'contact') openContact();
  else if (a.kind === 'insta') openInsta();
}
function pressA() {
  if (state === 'title') { start(); return; }
  if (modalOpen) return;
  if (dlg.active) { sfx('a'); advance(); return; }
  if (fading || P.moving) return;
  const f = facing();
  if (f) interact(f);
}
function pressB() { if (modalOpen) closeModal(); else if (dlg.active) advance(); }

function openArchive(key) {
  const a = ARCHIVE[key];
  if (!a) return;
  let i = 0;
  function go(d) {
    if (a.images.length < 2) return;
    i = (i + d + a.images.length) % a.images.length;
    draw();
  }
  function draw() {
    const imgs = a.images;
    sheet.textContent = '';
    sheet.appendChild(el('div', 'no', 'PROJECT ' + a.no + (a.type ? ' · ' + a.type : '')));
    sheet.appendChild(el('h2', '', a.title));
    const v = el('div', 'viewer');
    if (imgs.length) {
      const im = el('img');
      im.src = imgs[i];
      im.alt = a.title + ' 이미지 ' + (i + 1);
      v.appendChild(im);
    } else {
      v.appendChild(el('div', 'empty', '아직 등록된 이미지가 없어요\nARCHIVE의 images에 사진 경로를 넣어 주세요'));
    }
    if (imgs.length > 1) {
      v.appendChild(makeBtn('nav prev', '◀', function () { go(-1); }));
      v.appendChild(makeBtn('nav next', '▶', function () { go(1); }));
      v.appendChild(el('div', 'count', (i + 1) + ' / ' + imgs.length));
    }
    let sx = null;
    v.addEventListener('touchstart', function (e) { sx = e.touches.item(0).clientX; }, { passive: true });
    v.addEventListener('touchend', function (e) {
      if (sx === null) return;
      const dx = e.changedTouches.item(0).clientX - sx;
      if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
      sx = null;
    });
    sheet.appendChild(v);
    if (a.date) sheet.appendChild(el('div', 'meta', a.date));
    sheet.appendChild(el('p', 'desc', a.desc));
    const act = el('div', 'actions');
    if (a.post) act.appendChild(makeLink('btn primary', a.post, '인스타 게시물 보기 ▶'));
    act.appendChild(makeLink(a.post ? 'btn' : 'btn primary', SITE.insta, '인스타 계정 보기'));
    act.appendChild(makeBtn('btn', '닫기', closeModal));
    sheet.appendChild(act);
  }
  draw();
  showModal();
  modalNav = go;
}

    list.appendChild(listItem(a.no, a.title, function () { openArchive(key); }));
  });
  list.appendChild(listItem('IG', '인스타그램', openInsta));
  list.appendChild(listItem('✉', '컨택트', openContact));
  sheet.appendChild(list);
  const act = el('div', 'actions');
  act.appendChild(makeBtn('btn', '닫기', closeModal));
  sheet.appendChild(act);
  showModal();
}

/* =========================================================
   9. 시간대
   ========================================================= */
const TIME_MODES = ['auto', 'day', 'sunset', 'night'];
const TIME_LABEL = { auto: '자동', day: '낮', sunset: '노을', night: '밤' };
const TINT = { day: [255, 255, 255, 0], sunset: [255, 190, 150, 0.45], night: [96, 104, 176, 1] };
let timeMode = 'auto', tint = [255, 255, 255, 0], lastPhase = '';
function phase() {
  if (timeMode !== 'auto') return timeMode;
  const h = new Date().getHours();
  if (h >= 6 && h < 17) return 'day';
  if ((h >= 17 && h < 19) || h === 5) return 'sunset';
  return 'night';
}
function updateClock() {
  const d = new Date();
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  $('timeBtn').textContent = (timeMode === 'auto') ? hm + ' ' + TIME_LABEL[phase()] : TIME_LABEL[timeMode];
}
$('timeBtn').onclick = function () {
  timeMode = TIME_MODES[(TIME_MODES.indexOf(timeMode) + 1) % 4];
  sfx('a'); updateClock();
};
setInterval(updateClock, 10000);
updateClock();

/* =========================================================
   10. 음악 · 효과음 (직접 작곡한 칩튠)
   ========================================================= */
let actx = null, master = null, gains = [], loopTimer = null, curTrack = null, soundOn = true;
const NI = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
function freq(n) { return 440 * Math.pow(2, (NI[n.slice(0, -1)] + (Number(n.slice(-1)) - 4) * 12 - 9) / 12); }
function parse(s) {
  let t = 0;
  return s.trim().split(/\s+/).map(function (tok) {
    const p = tok.split('.');
    const e = { n: p[0], t: t, l: Number(p[1]) };
    t += Number(p[1]);
    return e;
  });
}
const TOWN_LEAD = 'C5.2 E5.2 G5.2 E5.2 F5.2 A5.2 G5.4 E5.2 G5.2 C6.2 B5.1 A5.1 G5.6 r.2 A5.2 G5.2 F5.2 E5.2 D5.2 E5.2 F5.4 E5.2 D5.2 C5.2 D5.2 C5.6 r.2';
const TOWN_BASS = 'C3.2 G3.2 C3.2 G3.2 F2.2 C3.2 F2.2 C3.2 C3.2 G3.2 C3.2 G3.2 G2.2 D3.2 G2.2 D3.2 F2.2 C3.2 F2.2 C3.2 G2.2 D3.2 G2.2 D3.2 C3.2 G3.2 G2.2 B2.2 C3.2 G3.2 C3.4';
const HOUSE_LEAD = 'G4.3 A4.1 B4.2 D5.2 C5.4 B4.2 A4.2 G4.2 E4.2 F4.2 A4.2 G4.8 A4.3 B4.1 C5.2 E5.2 D5.4 C5.2 B4.2 A4.2 F4.2 G4.2 B4.2 C5.8';
const HOUSE_BASS = 'G2.4 D3.4 A2.4 E3.4 C3.4 F2.4 G2.4 D3.4 F2.4 C3.4 G2.4 B2.4 F2.4 G2.4 C3.8';
const CAMP_LEAD = 'D5.2 B4.2 G4.2 B4.2 C5.4 A4.4 B4.2 G4.2 E4.2 G4.2 D4.8 E4.2 G4.2 A4.2 B4.2 C5.4 E5.4 D5.3 C5.1 B4.2 A4.2 G4.8';
const CAMP_ARP = 'G2.2 D3.2 G3.2 D3.2 A2.2 E3.2 C3.2 E3.2 G2.2 D3.2 G3.2 D3.2 G2.2 D3.2 B2.2 D3.2 C3.2 G3.2 C4.2 G3.2 A2.2 E3.2 A3.2 E3.2 D3.2 A3.2 F#3.2 A3.2 G2.2 D3.2 G3.4';
const TRACKS = {
  town:  { bpm: 124, parts: [{ wave: 'square', vol: 0.05, ev: parse(TOWN_LEAD) }, { wave: 'triangle', vol: 0.14, ev: parse(TOWN_BASS) }] },
  night: { bpm: 92,  parts: [{ wave: 'square', vol: 0.035, ev: parse(TOWN_LEAD) }, { wave: 'triangle', vol: 0.12, ev: parse(TOWN_BASS) }] },
  house: { bpm: 100, parts: [{ wave: 'square', vol: 0.045, ev: parse(HOUSE_LEAD) }, { wave: 'triangle', vol: 0.13, ev: parse(HOUSE_BASS) }] },
  camp:  { bpm: 84,  parts: [{ wave: 'triangle', vol: 0.14, ev: parse(CAMP_LEAD) }, { wave: 'square', vol: 0.025, ev: parse(CAMP_ARP) }] }
};
function tone(dest, type, f, t, d, v) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01);
  g.gain.setValueAtTime(v, t + d * 0.7); g.gain.linearRampToValueAtTime(0, t + d);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + d + 0.02);
}
function scheduleLoop(t0) {
  const tr = TRACKS[curTrack], step = 60 / tr.bpm / 2;
  const g = actx.createGain();
  g.connect(master); gains.push(g);
  if (gains.length > 3) gains.shift();
  let len = 0;
  tr.parts.forEach(function (p) {
    p.ev.forEach(function (e) {
      len = Math.max(len, e.t + e.l);
      if (e.n !== 'r') tone(g, p.wave, freq(e.n), t0 + e.t * step, e.l * step * 0.85, p.vol);
    });
  });
  const end = t0 + len * step;
  loopTimer = setTimeout(function () { scheduleLoop(end); }, Math.max(0, (end - actx.currentTime - 0.4) * 1000));
}
function stopMusic() {
  clearTimeout(loopTimer);
  const now = actx.currentTime;
  gains.forEach(function (g) {
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.linearRampToValueAtTime(0, now + 0.15);
    setTimeout(function () { g.disconnect(); }, 300);
  });
  gains = [];
}
function playTrack(name) {
  if (!actx || (name === curTrack && gains.length)) return;
  if (gains.length) stopMusic();
  curTrack = name;
  scheduleLoop(actx.currentTime + 0.2);
}
function updateMusic() {
  let name = 'town';
  if (cur.id === 'house') name = 'house';
  else if (cur.id === 'bamboo') name = 'camp';
  else if (phase() === 'night') name = 'night';
  playTrack(name);
}
function sfx(type) {
  if (!actx || !soundOn) return;
  const t = actx.currentTime;
  if (type === 'a') { tone(master, 'square', freq('A5'), t, 0.05, 0.05); tone(master, 'square', freq('E6'), t + 0.05, 0.06, 0.05); }
  if (type === 'door') { tone(master, 'square', freq('C5'), t, 0.08, 0.05); tone(master, 'square', freq('G4'), t + 0.08, 0.12, 0.05); }
  if (type === 'close') tone(master, 'square', freq('E5'), t, 0.05, 0.04);
}
function initAudio() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  master = actx.createGain();
  master.gain.value = soundOn ? 0.6 : 0;
  master.connect(actx.destination);
  if (actx.resume) actx.resume();
}
$('sndBtn').onclick = function () {
  soundOn = !soundOn; initAudio();
  if (master) master.gain.value = soundOn ? 0.6 : 0;
  $('sndBtn').textContent = soundOn ? '♪ ON' : '♪ OFF';
  if (state === 'play') updateMusic();
};

/* =========================================================
   11. 입력 (키보드 · 조이스틱 · 버튼 · 탭)
   ========================================================= */
function start() {
  if (state !== 'title') return;
  state = 'play';
  $('title').classList.add('hide');
  initAudio(); updateMusic();
}
['touchend', 'click'].forEach(function (ev) {
  $('title').addEventListener(ev, function (e) { e.preventDefault(); start(); }, { passive: false });
});
addEventListener('keydown', function (e) {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].indexOf(k) >= 0) e.preventDefault();
  keys[k] = true;
  if (e.repeat) return;
  if (state === 'title') { start(); return; }
  if (modalOpen && modalNav && (k === 'arrowleft' || k === 'arrowright')) { modalNav(k === 'arrowleft' ? -1 : 1); return; }
  if (['z', 'enter', ' ', 'e'].indexOf(k) >= 0) pressA();
  if (k === 'x' || k === 'escape') pressB();
});
addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', function () { Object.keys(keys).forEach(function (k) { keys[k] = false; }); });

const joy = $('joy'), knob = $('knob');
let joyId = null;
function moveJoy(e) {
  const r = joy.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const d = Math.hypot(dx, dy), max = 34;
  if (d > max) { dx *= max / d; dy *= max / d; }
  knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  if (d < 12) joyDir = null;
  else if (Math.abs(dx) > Math.abs(dy)) joyDir = (dx > 0) ? 'right' : 'left';
  else joyDir = (dy > 0) ? 'down' : 'up';
}
joy.addEventListener('pointerdown', function (e) { joyId = e.pointerId; joy.setPointerCapture(e.pointerId); moveJoy(e); });
joy.addEventListener('pointermove', function (e) { if (e.pointerId === joyId) moveJoy(e); });
function endJoy(e) { if (e.pointerId !== joyId) return; joyId = null; joyDir = null; knob.style.transform = ''; }
joy.addEventListener('pointerup', endJoy);
joy.addEventListener('pointercancel', endJoy);

$('btnA').addEventListener('pointerdown', function (e) { e.preventDefault(); pressA(); });
$('btnB').addEventListener('pointerdown', function (e) { e.preventDefault(); bHeld = true; pressB(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
  $('btnB').addEventListener(ev, function () { bHeld = false; });
});
$('dialog').addEventListener('click', function () { sfx('a'); advance(); });
$('prompt').addEventListener('click', pressA);
$('listBtn').onclick = function () { sfx('a'); openList(); };

// 화면의 오브젝트·NPC를 직접 눌러도 열림
cv.addEventListener('pointerdown', function (e) {
  if (locked()) return;
  const tx = Math.floor((e.clientX / scale + cam.x) / 16), ty = Math.floor((e.clientY / scale + cam.y) / 16);
  for (let i = 0; i < cur.npcs.length; i++) {
    const n = cur.npcs[i];
    if (n.x === tx && (n.y === ty || n.y === ty + 1)) { interact({ kind: 'npc', npc: n }); return; }
  }
  const a = findAct(tx, ty, true);
  if (a) interact(a);
});

/* =========================================================
   12. 화면 크기 · HUD · 렌더링
   ========================================================= */
let scale = 2;
const cam = { x: 0, y: 0 };
function resize() {
  scale = Math.max(2, Math.floor(Math.min(innerWidth, innerHeight) / 150));
  cv.width = Math.ceil(innerWidth / scale);
  cv.height = Math.ceil(innerHeight / scale);
  cv.style.width = cv.width * scale + 'px';
  cv.style.height = cv.height * scale + 'px';
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize);
resize();

const LABEL = { archive: '프로젝트 보기', dialog: '읽기', npc: '말 걸기', talk: '말 걸기', contact: '편지 보내기', insta: '인스타그램 보기' };
let hudKey = null, promptLabel = null;
function updateHUD() {
  let near = null, best = 99;
  cur.acts.forEach(function (a) {
    if (a.kind !== 'archive') return;
    const dx = Math.max(a.x - P.x, 0, P.x - (a.x + a.w - 1)), dy = Math.max(a.y - P.y, 0, P.y - (a.y + a.h - 1));
    if (dx + dy <= 2 && dx + dy < best) { best = dx + dy; near = a; }
  });
  const key = near ? near.key : '';
  if (key !== hudKey) {
    hudKey = key;
    const tag = $('tag');
    if (near) {
      const ar = ARCHIVE[key];
      tag.textContent = '';
      tag.appendChild(el('small', '', 'PROJECT ' + ar.no));
      tag.appendChild(el('b', '', ar.title));
    }
    tag.classList.toggle('show', !!near);
  }
  const f = (!locked() && !P.moving) ? facing() : null;
  const label = f ? LABEL[f.kind] : '';
  if (label !== promptLabel) {
    promptLabel = label;
    $('prompt').querySelector('span').textContent = label;
    $('prompt').classList.toggle('show', !!label);
  }
}
function frameOf(e) { if (!e.moving) return 0; if (e.t < 0.5) return e.flip ? 1 : 2; return 0; }
function drawEnt(e) {
  const x = Math.round(e.px - cam.x), y = Math.round(e.py - cam.y);
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.fillRect(x + 3, y + 13, 10, 3);
  const frames = e.spr[e.dir];
  ctx.drawImage(frames[frameOf(e)], x, y - 4);
}
// 바다 물결 + 밀려오는 파도
function drawSeaFX(t) {
  const m = cur.grid;
  function at(x, y) { const v = gget(m, x, y); return v === '' ? 'S' : v; }
  const x0 = Math.max(0, Math.floor(cam.x / 16)), y0 = Math.max(0, Math.floor(cam.y / 16));
  const x1 = Math.min(cur.w - 1, Math.floor((cam.x + cv.width) / 16)), y1 = Math.min(cur.h - 1, Math.floor((cam.y + cv.height) / 16));
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (gget(m, tx, ty) !== 'S') continue;
    const X = tx * 16 - cam.x, Y = ty * 16 - cam.y, h = hsh(tx, ty);
    const s1 = Math.floor(t * 5 + (h % 16)) % 16, s2 = 15 - Math.floor(t * 4 + ((h >>> 5) % 16)) % 16;
    R(ctx, '#8fe3d8', X + s1, Y + 3 + (h % 3), 3, 1);
    R(ctx, '#2f9aa0', X + s2, Y + 10 + ((h >>> 3) % 3), 4, 1);
    const w = (wave(t, tx * 16 + 8) + 1) / 2;
    if (at(tx, ty - 1) !== 'S') {
      const p = Math.round(w * 5);
      R(ctx, '#9be6dc', X, Y, 16, 7 - p);
      R(ctx, '#f0fffb', X, Y + 6 - p, 16, 1);
      for (let i = (tx * 5) % 4; i < 16; i += 4) R(ctx, '#f0fffb', X + i, Y + 7 - p, 2, 1);
      if (w > 0.85) for (let i = 1; i < 16; i += 5) R(ctx, '#ffffff', X + i, Y - 1, 2, 1);
      const p2 = Math.round(((wave(t - 1.2, tx * 16 + 8) + 1) / 2) * 4);
      R(ctx, '#c8f4ee', X + ((tx * 3) % 5), Y + 13 - p2, 8, 1);
    }
    if (at(tx - 1, ty) !== 'S') R(ctx, '#e8fbf6', X + Math.round(w * 2), Y, 1, 16);
    if (at(tx + 1, ty) !== 'S') R(ctx, '#e8fbf6', X + 15 - Math.round(w * 2), Y, 1, 16);
  }
}
function render(t) {
  const vw = cv.width, vh = cv.height, mw = cur.w * 16, mh = cur.h * 16;
  cam.x = (mw > vw) ? Math.max(0, Math.min(mw - vw, Math.round(P.px + 8 - vw / 2))) : Math.round((mw - vw) / 2);
  cam.y = (mh > vh) ? Math.max(0, Math.min(mh - vh, Math.round(P.py + 8 - vh / 2))) : Math.round((mh - vh) / 2);
  ctx.fillStyle = cur.bg || '#000';
  ctx.fillRect(0, 0, vw, vh);
  ctx.drawImage(cur.ground, -cam.x, -cam.y);
  if (cur.sea) drawSeaFX(t);

  const list = cur.objects.slice();
  [P].concat(cur.npcs).forEach(function (e) { list.push({ ent: e, base: e.py + 16 }); });
  list.sort(function (a, b) { return a.base - b.base; });
  list.forEach(function (o) {
    if (o.broken) return;
    try {
      if (o.ent) drawEnt(o.ent);
      else if (o.draw) o.draw(ctx, o.x - cam.x, o.y - cam.y, t);
      else {
        const x = o.x - cam.x, y = o.y - cam.y;
        if (x > vw || y > vh || x + o.img.width < 0 || y + o.img.height < 0) return;
        ctx.drawImage(o.img, x, y);
      }
    } catch (err) {
      o.broken = true;
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      window.showErr('그림 오류: ' + err.message);
    }
  });

  if (cur.id === 'bamboo') {
    const fx = 144 - cam.x, fy = 144 - cam.y;
    const gr = ctx.createRadialGradient(fx, fy, 40, fx, fy, 150);
    gr.addColorStop(0, 'rgba(10,18,8,0)');
    gr.addColorStop(1, 'rgba(10,18,8,0.6)');
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, vw, vh);
  }

  if (tint[0] < 254 || tint[1] < 254 || tint[2] < 254) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgb(' + Math.round(tint[0]) + ',' + Math.round(tint[1]) + ',' + Math.round(tint[2]) + ')';
    ctx.fillRect(0, 0, vw, vh);
    ctx.globalCompositeOperation = 'lighter';
    cur.lights.forEach(function (L) {
      const fl = L.flicker ? 1 + Math.sin(t * 9) * 0.04 + Math.sin(t * 23) * 0.03 : 1;
      const r = Math.max(1, L.r * fl), x = L.x - cam.x, y = L.y - cam.y;
      const a = Math.max(0, Math.min(1, (L.a || 0.55) * tint[3])).toFixed(3);
      const col = L.color || '255,190,110';
      const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, 'rgba(' + col + ',' + a + ')');
      gr.addColorStop(1, 'rgba(' + col + ',0)');
      ctx.fillStyle = gr;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    });
    ctx.globalCompositeOperation = 'source-over';
  }
}
function update(dt) {
  updatePlayer(dt);
  updateNPCs(dt);
  if (dlg.active) {
    dlg.shown = Math.min(dlg.full.length, dlg.shown + dt * 40);
    $('dtext').textContent = dlg.full.slice(0, Math.floor(dlg.shown));
  }
  const ph = phase();
  let tp = TINT[ph];
  if (cur.id === 'house') {
    if (ph === 'night') tp = [215, 205, 230, 0.5];
    else if (ph === 'sunset') tp = [255, 235, 215, 0.2];
    else tp = [255, 255, 255, 0];
  } else if (cur.id === 'bamboo') {
    tp = (ph === 'night') ? [64, 66, 110, 1] : [245, 165, 125, 0.85];   // 숲 안은 늘 노을빛
  }
  tint = tint.map(function (v, i) { return v + (tp[i] - v) * Math.min(1, dt * 2); });
  if (ph !== lastPhase) { lastPhase = ph; if (state === 'play') updateMusic(); updateClock(); }
  updateHUD();
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  try { update(dt); render(now / 1000); }
  catch (err) { ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; window.showErr('오류: ' + err.message); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// ROOFTOUCH-END
</script>
