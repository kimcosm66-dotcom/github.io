<script>
window.showErr = function (msg) {
  var box = document.getElementById('errbox');
  if (!box) {
    box = document.createElement('div');
    box.id = 'errbox';
    box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#c00;color:#fff;font:13px/1.6 sans-serif;padding:10px;white-space:pre-wrap;max-height:50vh;overflow:auto';
    box.onclick = function () { box.style.display = 'none'; };
    (document.body || document.documentElement).appendChild(box);
  }
  if (box.textContent.indexOf(msg) >= 0) return;
  box.style.display = 'block';
  box.textContent += msg + '\n';
};
window.addEventListener('error', function (e) {
  var line = e.lineno || 0;
  window.showErr('오류: ' + (e.message || '') + ' (' + (line || '?') + '행)\n이 화면을 캡처해서 보내 주세요. (빨간 박스를 누르면 닫혀요)');
  if (!line || !window.fetch) return;
  fetch(location.href, { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (src) {
    var rows = src.split('\n');
    var endMark = 'ROOFTOUCH' + '-END';
    var docMark = '<' + '!DOCTYPE';
    var ends = src.split(endMark).length - 1;
    var docs = src.split(docMark).length - 1;
    var info = '문제 줄 내용: ' + String(rows[line - 1] || '').trim().slice(0, 160) + '\n파일 전체 ' + rows.length + '줄';
    if (docs > 1) info += '\n→ 코드가 두 번 들어가 있어요. 전부 지운 뒤 한 번만 붙여넣어 주세요.';
    if (ends < 1) info += '\n→ 코드 끝부분이 잘렸어요. 마지막 줄까지 다 붙여넣어 주세요.';
    window.showErr(info);
  }).catch(function () {});
});
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
:root{--ink:#303038;--line:#505868;--orange:#f05a1e;--paper:#f8f8f8;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none;}
body{font-family:'Galmuri11','Galmuri9',monospace;color:var(--ink);user-select:none;-webkit-user-select:none;}
#game{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;}
.box{background:var(--paper);border:4px solid var(--line);border-radius:8px;box-shadow:inset 0 0 0 3px #c8d8f0,0 4px 0 rgba(0,0,0,.3);}
.btn{display:inline-block;font:inherit;font-size:13px;padding:8px 12px;background:var(--paper);border:3px solid var(--line);border-radius:6px;color:var(--ink);cursor:pointer;text-decoration:none;}
.btn.primary{background:var(--orange);color:#fff;}
#top{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;gap:6px;z-index:10;}
#top .btn{font-size:12px;padding:6px 9px;}
#tag{position:fixed;top:calc(58px + env(safe-area-inset-top));left:14px;z-index:10;color:#fff;text-shadow:2px 2px 0 #000;pointer-events:none;opacity:0;transform:translateY(-6px);transition:.25s;}
#tag.show{opacity:1;transform:none;}
#tag small{font-size:11px;letter-spacing:.25em;}
#tag b{display:block;font-size:22px;margin-top:6px;font-weight:normal;}
#prompt{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;display:none;align-items:center;gap:8px;padding:8px 14px;font-size:14px;color:#fff;text-shadow:2px 2px 0 #000;cursor:pointer;}
#prompt.show{display:flex;}
#prompt kbd{font:inherit;font-size:12px;padding:2px 7px;border:2px solid #fff;border-radius:4px;text-shadow:none;background:rgba(0,0,0,.35);}
body.touch #prompt{bottom:calc(170px + env(safe-area-inset-bottom));}
#dialog{position:fixed;left:10px;right:10px;bottom:calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;padding:14px 18px 20px;min-height:86px;font-size:15px;line-height:1.75;z-index:15;display:none;cursor:pointer;}
#dialog.show{display:block;}
#dialog::after{content:'▼';position:absolute;right:14px;bottom:6px;font-size:10px;color:#e04030;animation:blink .7s steps(2) infinite;}
body.touch #dialog{bottom:calc(170px + env(safe-area-inset-bottom));}
@keyframes blink{50%{opacity:0}}
#pad{display:none;}
body.touch #pad{display:block;}
#joy{position:fixed;right:22px;bottom:calc(26px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.35);touch-action:none;z-index:12;}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(248,248,248,.4);border:3px solid rgba(60,50,40,.45);pointer-events:none;}
.ab{position:fixed;width:62px;height:62px;border-radius:50%;font:inherit;font-size:20px;color:rgba(40,32,24,.85);background:rgba(248,248,248,.4);border:3px solid rgba(60,50,40,.45);touch-action:none;z-index:12;}
#btnA{left:100px;bottom:calc(62px + env(safe-area-inset-bottom));}
#btnB{left:22px;bottom:calc(24px + env(safe-area-inset-bottom));}
#modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.55);}
#modal.show{display:flex;}
#sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px;user-select:text;-webkit-user-select:text;}
.no{font-size:11px;letter-spacing:.2em;color:var(--orange);}
#sheet h2{font-size:20px;font-weight:normal;margin:6px 0 12px;}
.viewer{position:relative;aspect-ratio:4/3;background:#202838;border:3px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;}
.viewer.tall{aspect-ratio:auto;}.viewer.tall img{max-height:calc(88vh - 250px);max-height:calc(88dvh - 250px);width:auto;max-width:100%;height:auto;object-fit:contain;}   /* 세로로 긴 사진: 스크롤 없이 한 화면에 사진·설명·닫기까지 */
.viewer .nav{position:absolute;top:50%;transform:translateY(-50%);font:inherit;font-size:16px;padding:8px 10px;border:0;background:rgba(0,0,0,.45);color:#fff;cursor:pointer;}
.viewer .prev{left:0}.viewer .next{right:0}
.viewer .count{position:absolute;right:8px;bottom:6px;font-size:11px;color:#fff;text-shadow:1px 1px 0 #000;}
.empty{color:#9ab0c8;font-size:13px;line-height:1.9;text-align:center;padding:12px;white-space:pre-line;}
.meta{font-size:12px;color:#888;margin-top:10px;}
.desc{font-size:14px;line-height:1.85;margin-top:10px;white-space:pre-line;}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
.actions.col{flex-direction:column;align-items:stretch;}
.list{display:grid;gap:8px;margin-top:6px;}
.list .btn{text-align:left;}
.list span{color:var(--orange);margin-right:8px;}
#feed{margin-top:12px;}
.hint{font-size:12px;color:#888;line-height:1.8;margin-top:12px;}
#title{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:linear-gradient(#88c8f0 62%,#78c878 62%);cursor:pointer;transition:opacity .5s;}
#title.hide{opacity:0;pointer-events:none;}
#logo{width:192px;height:196px;image-rendering:pixelated;}
#title .sub{font-size:14px;letter-spacing:.35em;color:#fff;text-shadow:2px 2px 0 #304050;}
#title .start{font-size:15px;color:var(--ink);animation:blink 1s steps(2) infinite;}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;}
.bd{border:3px solid var(--line);border-radius:6px;margin:8px 0;background:var(--paper);}
.bd summary{cursor:pointer;padding:10px 12px;font-size:14px;list-style:none;}
.bd summary::-webkit-details-marker{display:none;}
.bd summary::after{content:'▾';float:right;}
.bd[open] summary::after{content:'▴';}
.bd .bdbody{padding:0 12px 12px;}
</style>

const $ = function (id) { return document.getElementById(id); };
const cv = $('game');
const ctx = cv.getContext('2d');
function R(g, c, x, y, w, h) {
  g.fillStyle = c;
  g.fillRect(x, y, w === undefined ? 1 : w, h === undefined ? 1 : h);
}
function hsh(x, y) { return ((x * 73856093) ^ (y * 19349663)) >>> 0; }
function wave(t, wx) { return Math.sin(t * 1.4 - wx * 0.022); }
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return { c: c, g: g };
}
// '1,2 3,4' 같은 글자를 좌표 목록으로 바꿈
function pts(s) {
  return s.split(' ').map(function (q) { const p = q.split(','); return { x: Number(p[0]), y: Number(p[1]) }; });
}
// 화면 요소 만들기 도구
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function makeLink(cls, href, text) {
  const a = el('a', cls, text);
  a.href = href; a.target = '_blank'; a.rel = 'noopener';
  return a;
}
function makeBtn(cls, text, fn) {
  const b = el('button', cls, text);
  b.type = 'button';
  b.onclick = fn;
  return b;
}

const HEAD = {
  down: '.....KKKKKK.....|....KOOOOOOK....|...KOOOWWOOOK...|...KOOOOOOOOK...|..KKKKKKKKKKKK..|...KHHSSSSHHK...|...KHSKSSKSHK...|...KSSSSSSSSK...|....KSSSSSSK....|...KTTTWWTTTK...|..KSTTTWWTTTSK..|..KSKTTTTTTKSK..|...KKNNNNNNKK...',

};
const LEGS = {
  down: {
    stand: '....KNNKKNNK....|....KNNKKNNK....|....KKK..KKK....',
    a:     '....KNNKKNNK....|....KNNK.KKK....|....KKK.........',
    b:     '....KNNKKNNK....|....KKK.KNNK....|.........KKK....'
  },
  side: {

    a:     '...KNNK.KNK.....|..KNNK...KNK....|..KKK.....KKK...'
  }
};
LEGS.side.b = LEGS.side.stand;

function buildChar(pal) {
  const out = {};
  ['down', 'up', 'left', 'right'].forEach(function (dir) {
    const base = (dir === 'left' || dir === 'right') ? 'side' : dir;
    const legs = (base === 'side') ? LEGS.side : LEGS.down;
    out[dir] = ['stand', 'a', 'b'].map(function (f) {
      const k = makeCanvas(16, 16);
      const lines = (HEAD[base] + '|' + legs[f]).split('|');
      lines.forEach(function (row, y) {
        for (let x = 0; x < row.length; x++) {
          const ch = row.charAt(x);
          if (ch !== '.') R(k.g, pal[ch], dir === 'left' ? 15 - x : x, y);
        }
      });
      return k.c;
    });
  });
  return out;
}
const BASE_PAL = { K: '#282830', W: '#f8f8f8', S: '#f8c8a0', N: '#384068' };
function palette(extra) { return Object.assign({}, BASE_PAL, extra); }
const SPR = {

// 말 (옆모습, 3프레임: 서 있기 / 걷기 a / 걷기 b)
function buildHorse(C) {
  const out = { left: [], right: [] };
  const O = '#2a1a10';
  for (let f = 0; f < 4; f++) {                          // 0 서기, 1·2 걷기, 3 자는 모습(고개 떨굼)
    const k = makeCanvas(24, 20), g = k.g;
    const sw = (f === 1) ? 1 : (f === 2) ? -1 : 0;
    // 멀리 있는 다리(어둡게)
    [[6 + sw, 1], [17 - sw, 1]].forEach(function (L) { R(g, C.shade, L[0], 13, 2, 5 - (sw ? 1 : 0)); R(g, C.hoof, L[0], 18 - (sw ? 1 : 0), 2, 1); });

// 마을: 왼쪽으로 넓힌 지도 (왼쪽 숲은 치우고 들판으로 이어짐, 말 울타리는 입구 길 왼쪽)
function buildTown() {
  const c = buildTownCore(), DX = TOWN_DX, MG = TOWN_MG, MGR = TOWN_MGR, CW = c.w, CH = c.h, W = CW + DX + MGR, H = CH + MG;
  const m = mkGrid(W, H, '.');
  for (let y = 0; y < CH; y++) for (let x = 0; x < DX; x++) gset(m, x, y, y < 5 ? 'M' : (y === 5) ? 'T' : '.');   // 새 왼쪽 땅: 위는 하늘·나무줄
  for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) gset(m, x + DX, y, gget(c.grid, x, y));
  // 가장자리는 바다·길을 빼고 전부 나무
  for (let y = 5; y < CH; y++) { gset(m, MG, y, 'T'); gset(m, DX + CW - 2, y, 'T'); gset(m, DX + CW - 1, y, 'T'); }
  for (let x = MG; x < DX + CW; x++) { if (['S', 'q', 'k', 'K', 'c', 'p', 'D', 'G'].indexOf(gget(m, x, CH - 1)) < 0) gset(m, x, CH - 1, 'T'); }
  // 화면 바깥 여백: 가장자리 칸을 그대로 이어 붙임 (나무는 나무로, 길은 길로, 바다는 바다로)
  for (let y = 0; y < CH; y++) { for (let x = 0; x < MG; x++) gset(m, x, y, gget(m, MG, y)); for (let x = DX + CW; x < W; x++) gset(m, x, y, gget(m, DX + CW - 1, y)); }
  for (let y = CH; y < H; y++) for (let x = 0; x < W; x++) gset(m, x, y, gget(m, x, CH - 1));
  const BX = DX + CW - 2;                                  // 맨 오른쪽 위 모서리: 오른쪽에서 두 칸 × 위에서 두 칸의 나무 4그루를 치우고 곰의 빈터로
  [[BX, 5], [BX + 1, 5], [BX, 6], [BX + 1, 6]].forEach(function (q) { gset(m, q[0], q[1], '.'); });
  setList(m, (DX - 1) + ',19 ' + (DX - 1) + ',21 ' + (DX - 1) + ',23 ' + (DX - 2) + ',22 ' + (DX - 1) + ',24', 'K');   // 들판쪽으로 번진 갯바위
  const PX0 = DX - 3, PX1 = DX + 3;                        // 울타리 가로 범위 (오른쪽 끝이 입구 길 바로 옆)
  fill(m, PX0, 9, PX1 - PX0 + 1, 5, 'X'); fill(m, PX0 + 1, 10, PX1 - PX0 - 1, 3, '.');
  fill(m, 16, 8, 8, 1, '.');                                         // 옛 대나무숲 자리(아래 줄·입구) 정리
  fill(m, 16, 4, 8, 1, 'M'); fill(m, 16, 5, 8, 3, 'X'); setList(m, '17,8 22,8', 'X');   // HOLY LAND 건물 (오른쪽, 문은 안 열림)
  gset(m, 15, 5, '.');                                               // 숲과 건물 사이 나무 없음
  fill(m, 8, 4, 7, 5, 'B'); gset(m, 11, 8, 'G');                     // 대나무숲 (왼쪽): 입구 가운데
  fill(m, 11, 9, 1, 5, 'p');                                         // 대나무숲 길 (얇게, 울타리 왼쪽)
  fill(m, 19, 8, 2, 6, 'p'); fill(m, 11, 14, 6, 2, 'p');             // 건물 길 (두껍게, 울타리 오른쪽) + 큰길 왼쪽 연장                                          // HOLY LAND 건물 (대나무숲과 한 칸 띄움, 문은 안 열림)
  const map = { id: 'town', w: W, h: H, grid: m, sea: true, dx: DX, limit: { x0: MG, x1: W - 1 - MGR, y1: CH - 1 } };
  Object.keys(c).forEach(function (k) { if (!(k in map) && k !== 'ground') map[k] = c[k]; });
  map.ground = buildGround(map);
  const o = [{ draw: drawHolyLand, x: 16 * 16, y: 8 * 16 - 84, base: 8 * 16 }, { img: IMG.potTree, x: 17 * 16, y: 9 * 16 - 40, base: 9 * 16 }, { img: IMG.potTree, x: 22 * 16, y: 9 * 16 - 40, base: 9 * 16 }];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const v = gget(m, x, y);
    if (v === 'T') o.push({ img: IMG.tree, x: x * 16, y: y * 16 - 8, base: y * 16 + 16 });
    if (v === 'B') o.push({ img: IMG.bambooS[hsh(x, y) % 3], x: x * 16 - 1, y: y * 16 - 16, base: y * 16 + 16 });
  }
  // 말 울타리 (테두리 칸마다 기둥 + 가로대)
  const inRing = function (rx, ry) { return rx >= PX0 && rx <= PX1 && ry >= 9 && ry <= 13 && !(rx > PX0 && rx < PX1 && ry > 9 && ry < 13); };
  for (let y = 9; y <= 13; y++) for (let x = PX0; x <= PX1; x++) {
    if (!inRing(x, y)) continue;
    const L = inRing(x - 1, y), Rt = inRing(x + 1, y), U = inRing(x, y - 1), D = inRing(x, y + 1);
    const k = makeCanvas(16, 16), g = k.g;
    if (L) { R(g, '#c89860', 0, 5, 8, 2); R(g, '#8a6030', 0, 7, 8, 1); R(g, '#c89860', 0, 10, 8, 2); R(g, '#8a6030', 0, 12, 8, 1); }
    if (Rt) { R(g, '#c89860', 8, 5, 8, 2); R(g, '#8a6030', 8, 7, 8, 1); R(g, '#c89860', 8, 10, 8, 2); R(g, '#8a6030', 8, 12, 8, 1); }
    if (U) R(g, '#b88a50', 7, 0, 2, 8);
    if (D) R(g, '#b88a50', 7, 8, 2, 8);
    R(g, '#6a4020', 6, 3, 4, 12); R(g, '#8a5a30', 6, 3, 3, 11); R(g, '#d8a870', 6, 2, 4, 1); R(g, '#b88050', 6, 3, 1, 10);
    o.push({ img: k.c, x: x * 16, y: y * 16, base: y * 16 + 16 });
  }
  c.objects.forEach(function (ob) { ob.x += DX * 16; o.push(ob); });
  map.objects = o;
  map.acts = c.acts.map(function (a) { a.x += DX; return a; });
  map.acts.unshift({ x: PX0, y: 9, w: PX1 - PX0 + 1, h: 5, kind: 'dialog', lines: function () { return phase() === 'night' ? ['말들이 조용히 자고 있다.', '(zzz,,,)'] : ['울타리 안에서 말 두 마리가 느긋하게 거닐고 있다.', '히이잉~']; } });
  map.npcs = c.npcs;
  map.npcs.forEach(function (n) { n.x += DX; n.nx = n.x; n.px = n.x * 16; n.home.x += DX; });
  const h1 = npc(DX - 2, 11, HORSE[0], function () { return phase() === 'night' ? ['말들이 조용히 자고 있다.', '(zzz,,,)'] : ['히이잉~']; }, { dir: 'right' }); h1.horse = true;
  const h2 = npc(DX + 1, 12, HORSE[1], function () { return phase() === 'night' ? ['말들이 조용히 자고 있다.', '(zzz,,,)'] : ['푸르르~']; }, { dir: 'left' }); h2.horse = true;
  map.npcs.push(h1, h2);
  map.npcs.forEach(function (n) {                          // 대나무숲 안내 NPC: 새 입구 길 옆(왼쪽)으로

const CAMP_ARP = 'G2.2 D3.2 G3.2 D3.2 A2.2 E3.2 C3.2 E3.2 G2.2 D3.2 G3.2 D3.2 G2.2 D3.2 B2.2 D3.2 C3.2 G3.2 C4.2 G3.2 A2.2 E3.2 A3.2 E3.2 D3.2 A3.2 F#3.2 A3.2 G2.2 D3.2 G3.4';
const TRACKS = {
  town:  { bpm: 124, parts: [{ wave: 'square', vol: 0.05, ev: parse(TOWN_LEAD) }, { wave: 'triangle', vol: 0.14, ev: parse(TOWN_BASS) }] },
  night: { bpm: 92,  parts: [{ wave: 'square', vol: 0.035, ev: parse(TOWN_LEAD) }, { wave: 'triangle', vol: 0.12, ev: parse(TOWN_BASS) }] },
  house: { bpm: 100, parts: [{ wave: 'square', vol: 0.045, ev: parse(HOUSE_LEAD) }, { wave: 'triangle', vol: 0.13, ev: parse(HOUSE_BASS) }] },
  camp:  { bpm: 84,  parts: [{ wave: 'triangle', vol: 0.14, ev: parse(CAMP_LEAD) }, { wave: 'square', vol: 0.025, ev: parse(CAMP_ARP) }] }
};
function tone(dest, type, f, t, d, v) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01);
  g.gain.setValueAtTime(v, t + d * 0.7); g.gain.linearRampToValueAtTime(0, t + d);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + d + 0.02);
}
function scheduleLoop(t0) {
  const tr = TRACKS[curTrack], step = 60 / tr.bpm / 2;
  const g = actx.createGain();
  g.connect(master); gains.push(g);
  if (gains.length > 3) gains.shift();
  let len = 0;
  tr.parts.forEach(function (p) {
    p.ev.forEach(function (e) {
      len = Math.max(len, e.t + e.l);
      if (e.n !== 'r') tone(g, p.wave, freq(e.n), t0 + e.t * step, e.l * step * 0.85, p.vol);
    });
  });
  const end = t0 + len * step;
  loopTimer = setTimeout(function () { scheduleLoop(end); }, Math.max(0, (end - actx.currentTime - 0.4) * 1000));
}
function stopMusic() {
  clearTimeout(loopTimer);
  const now = actx.currentTime;
  gains.forEach(function (g) {
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.linearRampToValueAtTime(0, now + 0.15);
    setTimeout(function () { g.disconnect(); }, 300);
  });
  gains = [];
}
function playTrack(name) {
  if (!actx || (name === curTrack && gains.length)) return;
  if (gains.length) stopMusic();
  curTrack = name;
  scheduleLoop(actx.currentTime + 0.2);
}
function updateMusic() {
  let name = 'town';
  if (cur.id === 'house') name = 'house';
  else if (cur.id === 'bamboo') name = 'camp';
  else if (phase() === 'night') name = 'night';
  playTrack(name);
}
function sfx(type) {
  if (!actx || !soundOn) return;
  const t = actx.currentTime;
  if (type === 'a') { tone(master, 'square', freq('A5'), t, 0.05, 0.05); tone(master, 'square', freq('E6'), t + 0.05, 0.06, 0.05); }
  if (type === 'door') { tone(master, 'square', freq('C5'), t, 0.08, 0.05); tone(master, 'square', freq('G4'), t + 0.08, 0.12, 0.05); }
  if (type === 'close') tone(master, 'square', freq('E5'), t, 0.05, 0.04);
}
function initAudio() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  master = actx.createGain();
  master.gain.value = soundOn ? 0.6 : 0;
  master.connect(actx.destination);
  if (actx.resume) actx.resume();
}
$('sndBtn').onclick = function () {
  soundOn = !soundOn; initAudio();
  if (master) master.gain.value = soundOn ? 0.6 : 0;
  $('sndBtn').textContent = soundOn ? '♪ ON' : '♪ OFF';
  if (state === 'play') updateMusic();
};

/* =========================================================
   11. 입력 (키보드 · 조이스틱 · 버튼 · 탭)
   ========================================================= */
function start() {
  if (state !== 'title') return;
  state = 'play';
  $('title').classList.add('hide');
  initAudio(); updateMusic();
}
['touchend', 'click'].forEach(function (ev) {
  $('title').addEventListener(ev, function (e) { e.preventDefault(); start(); }, { passive: false });
});
addEventListener('keydown', function (e) {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].indexOf(k) >= 0) e.preventDefault();
  keys[k] = true;
  if (e.repeat) return;
  if (state === 'title') { start(); return; }
  if (modalOpen && modalNav && (k === 'arrowleft' || k === 'arrowright')) { modalNav(k === 'arrowleft' ? -1 : 1); return; }
  if (['z', 'enter', ' ', 'e'].indexOf(k) >= 0) pressA();
  if (k === 'x' || k === 'escape') pressB();
});
addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', function () { Object.keys(keys).forEach(function (k) { keys[k] = false; }); });

const joy = $('joy'), knob = $('knob');
let joyId = null;
function moveJoy(e) {
  const r = joy.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const d = Math.hypot(dx, dy), max = 34;
  if (d > max) { dx *= max / d; dy *= max / d; }
  knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  if (d < 12) joyDir = null;
  else if (Math.abs(dx) > Math.abs(dy)) joyDir = (dx > 0) ? 'right' : 'left';
  else joyDir = (dy > 0) ? 'down' : 'up';
}
joy.addEventListener('pointerdown', function (e) { joyId = e.pointerId; joy.setPointerCapture(e.pointerId); moveJoy(e); });
joy.addEventListener('pointermove', function (e) { if (e.pointerId === joyId) moveJoy(e); });
function endJoy(e) { if (e.pointerId !== joyId) return; joyId = null; joyDir = null; knob.style.transform = ''; }
joy.addEventListener('pointerup', endJoy);
joy.addEventListener('pointercancel', endJoy);

$('btnA').addEventListener('pointerdown', function (e) { e.preventDefault(); pressA(); });
$('btnB').addEventListener('pointerdown', function (e) { e.preventDefault(); bHeld = true; pressB(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
  $('btnB').addEventListener(ev, function () { bHeld = false; });
});
$('dialog').addEventListener('click', function () { sfx('a'); advance(); });
$('prompt').addEventListener('click', pressA);
$('listBtn').onclick = function () { sfx('a'); openList(); };

// 화면의 오브젝트·NPC를 직접 눌러도 열림
cv.addEventListener('pointerdown', function (e) {
  if (locked()) return;
  const tx = Math.floor((e.clientX / scale + cam.x) / 16), ty = Math.floor((e.clientY / scale + cam.y) / 16);
  for (let i = 0; i < cur.npcs.length; i++) {
    const n = cur.npcs[i];
    if (n.x === tx && (n.y === ty || n.y === ty + 1)) { interact(n.beetle ? { kind: 'archive', key: 'beetle' } : { kind: 'npc', npc: n }); return; }
  }
  const a = findAct(tx, ty, true);
  if (a) interact(a);
});

/* =========================================================
   12. 화면 크기 · HUD · 렌더링
   ========================================================= */
let scale = 2;
const cam = { x: 0, y: 0 };
function resize() {
  scale = Math.max(2, Math.floor(Math.min(innerWidth, innerHeight) / 150));
  cv.width = Math.ceil(innerWidth / scale);
  cv.height = Math.ceil(innerHeight / scale);
  cv.style.width = cv.width * scale + 'px';
  cv.style.height = cv.height * scale + 'px';
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize);
resize();

const LABEL = { archive: '프로젝트 보기', dialog: '읽기', npc: '말 걸기', talk: '말 걸기', contact: '편지 보내기', insta: '인스타그램 보기', board: '안내게시판 보기' };
let hudKey = null, promptLabel = null;
function updateHUD() {
  let near = null, best = 99;
  cur.acts.forEach(function (a) {
    if (a.kind !== 'archive' || a.quiet) return;           // quiet: 가까이 가도 이름표가 뜨지 않고, 눌렀을 때만 열림
    const dx = Math.max(a.x - P.x, 0, P.x - (a.x + a.w - 1)), dy = Math.max(a.y - P.y, 0, P.y - (a.y + a.h - 1));
    if (dx + dy <= 2 && dx + dy < best) { best = dx + dy; near = a; }
  });
  const key = near ? near.key : '';
  if (key !== hudKey) {
    hudKey = key;
    const tag = $('tag');
    if (near) {
      const ar = ARCHIVE[key];
      tag.textContent = '';
      tag.appendChild(el('small', '', 'PROJECT ' + ar.no));
      tag.appendChild(el('b', '', ar.title));
    }
    tag.classList.toggle('show', !!near);
  }
  const f = (!locked() && !P.moving) ? facing() : null;
  const label = f ? (f.label || LABEL[f.kind]) : '';
  if (label !== promptLabel) {
    promptLabel = label;
    $('prompt').querySelector('span').textContent = label;
    $('prompt').classList.toggle('show', !!label);
  }
}
function frameOf(e) { if (!e.moving) return 0; if (e.t < 0.5) return e.flip ? 1 : 2; return 0; }
function drawBeetle(x, y, e) {                                           // 멀리선 까만 점, 가까이 가면 뿔 달린 장수풍뎅이
  const t = performance.now() / 1000, bx = x + 3, by = y + 8;
  if (e.dir === 'left' || e.dir === 'right') e.face = e.dir;
  if (Math.hypot(P.px - e.px, P.py - e.py) > 36) {
    ctx.fillStyle = '#17100a'; ctx.fillRect(x + 7, y + 11 + (e.moving && Math.floor(t * 8) % 2 ? 0 : 0), 2, 2);
    return;
  }
  const fl = e.face === 'left', f = function (i, j, w, h, c) { ctx.fillStyle = c; ctx.fillRect(fl ? bx + 9 - i - w : bx + i, by + j, w, h); };
  const st = (e.moving && Math.floor(t * 10) % 2) ? 1 : 0;
  f(0, 6, 9, 1, 'rgba(0,0,0,.22)');                                      // 그림자
  f(2, 5 + 0, 1, 1, st ? '#15100a' : '#15100a'); f(4, 5, 1, 1, '#15100a'); f(6, 5, 1, 1, '#15100a');
  if (st) { f(2, 6, 1, 1, '#15100a'); f(6, 6, 1, 1, '#15100a'); } else { f(4, 6, 1, 1, '#15100a'); }   // 다리가 번갈아 움직임
  f(0, 2, 6, 3, '#3a2414'); f(1, 1, 4, 1, '#3a2414'); f(1, 5, 4, 1, '#2a1a0e'); f(1, 2, 3, 1, '#6a4428'); f(3, 3, 1, 1, '#4e3320');   // 딱지날개 + 광택
  f(5, 2, 2, 3, '#1c120a');                                              // 앞가슴
  f(7, 3, 1, 2, '#15100a');                                              // 머리
  f(7, 2, 2, 1, '#15100a'); f(8, 1, 1, 1, '#15100a'); f(9, 0, 1, 2, '#15100a'); f(8, 0, 1, 1, '#15100a');   // 긴 뿔
}
function drawEnt(e) {
  const x = Math.round(e.px - cam.x), y = Math.round(e.py - cam.y);
  if (e.beetle) { drawBeetle(x, y, e); return; }
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  if (e.horse) {
    if (e.dir === 'left' || e.dir === 'right') e.face = e.dir;
    ctx.fillRect(x - 1, y + 12, 18, 3);
    const asleep = !e.moving && phase() === 'night';
    ctx.drawImage(e.spr[e.face || 'right'][asleep ? 3 : frameOf(e)], x - 4, y - 6);
    if (asleep) {                                                   // zZ
      const tt = performance.now() / 1000, hx = ((e.face || 'right') === 'right') ? x + 16 : x - 4;
      [0, 1].forEach(function (i) {
        const ph = (tt * 0.6 + i * 0.5) % 1, zs = i ? 3 : 2, zx = Math.round(hx + ph * 5 * (i + 1)), zy = Math.round(y - 4 - ph * 9);
        ctx.globalAlpha = 1 - ph * 0.8; ctx.fillStyle = '#f4f4ff';
        ctx.fillRect(zx, zy, zs + 1, 1); ctx.fillRect(zx + zs, zy + 1, 1, 1); ctx.fillRect(zx + zs - 1, zy + 2, 1, 1); ctx.fillRect(zx, zy + zs, zs + 1, 1);
        ctx.fillStyle = '#3a3a6a'; ctx.fillRect(zx, zy + zs + 1, zs + 1, 1);
        ctx.globalAlpha = 1;
      });
    }
    return;
  }
  if (e.bear) {
    if (e.dir === 'left' || e.dir === 'right') e.face = e.dir;
    ctx.fillRect(x - 3, y + 11, 22, 4);
    const shake = (e.stand && phase() === 'night' && Math.floor(performance.now() / 120) % 2) ? 1 : 0;      // 일어서서 으르렁거릴 때 몸을 떨며
    const night = phase() === 'night', set = night ? e.spr.night : e.spr.day;
    ctx.drawImage(set[e.face || 'left'][(night && e.stand) ? 3 : frameOf(e)], x - 6 + shake, y - 14);
    return;
  }
  ctx.fillRect(x + 3, y + 13, 10, 3);
  const frames = e.spr[e.dir];
  ctx.drawImage(frames[frameOf(e)], x, y - 4);
}
// 바다 물결 + 밀려오는 파도
function drawSeaFX(t) {
  const m = cur.grid;
  function at(x, y) { const v = gget(m, x, y); return v === '' ? 'S' : v; }
  const x0 = Math.max(0, Math.floor(cam.x / 16)), y0 = Math.max(0, Math.floor(cam.y / 16));
  const x1 = Math.min(cur.w - 1, Math.floor((cam.x + cv.width) / 16)), y1 = Math.min(cur.h - 1, Math.floor((cam.y + cv.height) / 16));
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (gget(m, tx, ty) !== 'S') continue;
    const X = tx * 16 - cam.x, Y = ty * 16 - cam.y, h = hsh(tx, ty);
    const s1 = Math.floor(t * 5 + (h % 16)) % 16, s2 = 15 - Math.floor(t * 4 + ((h >>> 5) % 16)) % 16;
    R(ctx, '#8fe3d8', X + s1, Y + 3 + (h % 3), 3, 1);
    R(ctx, '#2f9aa0', X + s2, Y + 10 + ((h >>> 3) % 3), 4, 1);
    const w = (wave(t, tx * 16 + 8) + 1) / 2;
    if (at(tx, ty - 1) !== 'S') {
      const p = Math.round(w * 5);
      R(ctx, '#9be6dc', X, Y, 16, 7 - p);
      R(ctx, '#f0fffb', X, Y + 6 - p, 16, 1);
      for (let i = (tx * 5) % 4; i < 16; i += 4) R(ctx, '#f0fffb', X + i, Y + 7 - p, 2, 1);
      if (w > 0.85) for (let i = 1; i < 16; i += 5) R(ctx, '#ffffff', X + i, Y - 1, 2, 1);
      const p2 = Math.round(((wave(t - 1.2, tx * 16 + 8) + 1) / 2) * 4);
      R(ctx, '#c8f4ee', X + ((tx * 3) % 5), Y + 13 - p2, 8, 1);
    }
    if (at(tx - 1, ty) !== 'S') R(ctx, '#e8fbf6', X + Math.round(w * 2), Y, 1, 16);
    if (at(tx + 1, ty) !== 'S') R(ctx, '#e8fbf6', X + 15 - Math.round(w * 2), Y, 1, 16);
  }
}
function render(t) {
  const vw = cv.width, vh = cv.height, mw = cur.w * 16, mh = cur.h * 16;
  cam.x = (mw > vw) ? Math.max(0, Math.min(mw - vw, Math.round(P.px + 8 - vw / 2))) : Math.round((mw - vw) / 2);
  cam.y = (mh > vh) ? Math.max(0, Math.min(mh - vh, Math.round(P.py + 8 - vh / 2))) : Math.round((mh - vh) / 2);
  ctx.fillStyle = cur.bg || '#000';
  ctx.fillRect(0, 0, vw, vh);
  ctx.drawImage(cur.ground, -cam.x, -cam.y);
  if (cur.sea) drawSeaFX(t);

  const list = cur.objects.slice();
  [P].concat(cur.npcs).forEach(function (e) { list.push({ ent: e, base: e.py + 16 }); });
  list.sort(function (a, b) { return a.base - b.base; });
  list.forEach(function (o) {
    if (o.broken) return;
    try {
      if (o.ent) drawEnt(o.ent);
      else if (o.draw) o.draw(ctx, o.x - cam.x, o.y - cam.y, t);
      else {
        const x = o.x - cam.x, y = o.y - cam.y;
        if (x > vw || y > vh || x + o.img.width < 0 || y + o.img.height < 0) return;
        ctx.drawImage(o.img, x, y);
      }
    } catch (err) {
      o.broken = true;
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      window.showErr('그림 오류: ' + err.message);
    }
  });

  if (cur.id === 'bamboo') {
    const fx = 144 - cam.x, fy = 144 - cam.y;
    const gr = ctx.createRadialGradient(fx, fy, 40, fx, fy, 150);
    gr.addColorStop(0, 'rgba(10,18,8,0)');
    gr.addColorStop(1, 'rgba(10,18,8,0.6)');
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, vw, vh);
  }

  if (tint[0] < 254 || tint[1] < 254 || tint[2] < 254) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgb(' + Math.round(tint[0]) + ',' + Math.round(tint[1]) + ',' + Math.round(tint[2]) + ')';
    ctx.fillRect(0, 0, vw, vh);
    ctx.globalCompositeOperation = 'lighter';
    cur.lights.forEach(function (L) {
      const fl = L.flicker ? 1 + Math.sin(t * 9) * 0.04 + Math.sin(t * 23) * 0.03 : 1;
      const r = Math.max(1, L.r * fl), x = L.x - cam.x, y = L.y - cam.y;
      const a = Math.max(0, Math.min(1, (L.a || 0.55) * tint[3])).toFixed(3);
      const col = L.color || '255,190,110';
      const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, 'rgba(' + col + ',' + a + ')');
      gr.addColorStop(1, 'rgba(' + col + ',0)');
      ctx.fillStyle = gr;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    });
    ctx.globalCompositeOperation = 'source-over';
  }
}
function update(dt) {
  updatePlayer(dt);
  updateNPCs(dt);
  if (dlg.active) {
    dlg.shown = Math.min(dlg.full.length, dlg.shown + dt * 40);
    $('dtext').textContent = dlg.full.slice(0, Math.floor(dlg.shown));
  }
  const ph = phase();
  let tp = TINT[ph];
  if (cur.id === 'house') {
    if (ph === 'night') tp = [215, 205, 230, 0.5];
    else if (ph === 'sunset') tp = [255, 235, 215, 0.2];
    else tp = [255, 255, 255, 0];
  } else if (cur.id === 'bamboo') {
    tp = (ph === 'night') ? [64, 66, 110, 1] : [245, 165, 125, 0.85];   // 숲 안은 늘 노을빛
  }
  tint = tint.map(function (v, i) { return v + (tp[i] - v) * Math.min(1, dt * 2); });
  if (ph !== lastPhase) { lastPhase = ph; if (state === 'play') updateMusic(); updateClock(); }
  updateHUD();
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  try { update(dt); render(now / 1000); }
  catch (err) { ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; window.showErr('오류: ' + err.message); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// ROOFTOUCH-END
</script>
